# OPH paper content inventory.
# Purpose: keep each paper's role explicit and move detailed claim tables or
# sector details to the companion papers that carry them.
# Scope: the root papers under paper/, the shared fragment they include, and the
# focused notes under extra/ whose role needs stating beside them. The cosmology
# set is indexed in cosmology/README.md and the remaining notes in extra/README.md.
# tools/test_paper_release_manifest.py checks that every path and paper named
# here resolves to a tracked source.

shared_fragments:
  paper/tex_fragments/EXECUTABLE_COMPLETION_HYPOTHESIS.tex:
    role: shared tower panel stating the executable-model hypothesis, the tower layers and the stopping rules
    included_by:
      - executable_observer_construction
      - reality_as_consensus_protocol
      - observers_are_all_you_need
      - recovering_observer_spacetime_and_einstein_dynamics_from_overlap_consistency
      - deriving_standard_model_gauge_structure_from_observer_overlap_consistency
      - deriving_the_particle_zoo_from_observer_consistency
      - screen_microphysics_and_observer_synchronization
  paper/tex_fragments/PAPER.tex:
    role: recovered-core section and Einstein chain of the spacetime paper
    included_by:
      - recovering_observer_spacetime_and_einstein_dynamics_from_overlap_consistency
    name_cited_under_pins:
      - code/a5_closure manifests
      - one frozen custody record

