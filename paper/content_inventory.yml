style_policy:
  front_matter:
    - lead with theory content ahead of ledgers
    - use claim-boundary ledgers late in synthesis papers
    - cite companion papers for sector detail
    - keep abstracts short, readable, and informal, and name the main results
    - do not use internal dependency-node labels, code identifiers, or schema-style names in abstracts or informal summaries
    - define named selectors and acronyms before any shortened form is used
  prose:
    - avoid em dash scaffolding
    - avoid stock transition phrases
    - avoid formulaic contrast templates
    - state claim boundaries directly; keep mutable project state in GitHub issues
    - do not promote finite diagnostics or calibration displays to physical observables by relabeling
