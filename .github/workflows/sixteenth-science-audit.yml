name: Temporary nine-source cold and finite-proof audit
on:
  push:
    branches: ['codex/oph-sixteenth-science-20261113']
permissions:
  contents: read
jobs:
  scientific-cold:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_CORETYPE: Haswell
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - name: Install exact model environment
        run: |
          python -m pip install -r model/requirements.txt
          echo "AUDIT_OUTPUT=$RUNNER_TEMP/oph-sixteenth-science" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/oph-sixteenth-science"
          python -m pip freeze > "$RUNNER_TEMP/oph-sixteenth-science/environment.txt"
          cp .github/sixteenth-science/manifest.json "$RUNNER_TEMP/oph-sixteenth-science/manifest.json"
      - name: Original independent cold and warnings-as-errors tests
        run: python .github/sixteenth-science/replay.py '${{ matrix.shard }}'
      - name: Retain actual cold logs and source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sixteenth-science-${{ matrix.shard }}
          path: ${{ runner.temp }}/oph-sixteenth-science/
          include-hidden-files: true
          retention-days: 7
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - name: Initialize immutable source evidence
        run: |
          echo "AUDIT_OUTPUT=$RUNNER_TEMP/oph-sixteenth-lean" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/oph-sixteenth-lean"
          cp .github/sixteenth-science/manifest.json "$RUNNER_TEMP/oph-sixteenth-lean/manifest.json"
      - name: Install pinned Lean environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o elan.tar.gz "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz" | sha256sum -c -
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore authenticated Lake build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: Lean/.lake/build
          key: lean-core-v3-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lean-core-v3-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}-
            lean-core-v3-${{ runner.os }}-
      - name: Authenticate scientific and Lean input bytes
        run: python .github/sixteenth-science/replay.py source-check
      - name: Compile the actual tensor-transport theorem module
        working-directory: Lean
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'leanprover/lean4:v4.29.1' lean-toolchain
          lean --version | tee "$AUDIT_OUTPUT/lean-version.txt"
          lake exe cache get 2>&1 | tee "$AUDIT_OUTPUT/mathlib-cache.log"
          lake env lean -o "$AUDIT_OUTPUT/TensorRecordTransport.olean" ObserverPatchHolography/TensorRecordTransport.lean 2>&1 | tee "$AUDIT_OUTPUT/TensorRecordTransport.log"
      - name: Confirm original source and receipts unchanged
        shell: bash
        run: |
          set -euo pipefail
          python .github/sixteenth-science/replay.py source-check | tee "$AUDIT_OUTPUT/source-check.log"
          git diff --exit-code
          git rev-parse HEAD > "$AUDIT_OUTPUT/commit.txt"
      - name: Retain actual kernel logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sixteenth-lean
          path: ${{ runner.temp }}/oph-sixteenth-lean/
          include-hidden-files: true
          retention-days: 7
