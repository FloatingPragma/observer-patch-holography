name: M1 Interface Compactness

on:
  push:
    branches: [main]
    paths:
      - "code/m1_interfaces/**"
      - "Lean/Geometry/M1Interfaces*.lean"
      - "Lean/Geometry/FlatDiamondNormalization.lean"
      - "Lean/Geometry/OrderingFractionFourDimensional.lean"
      - "paper/tex_fragments/M1_INTERFACES.tex"
      - "claims/claim_registry.yaml"
      - ".github/workflows/m1-interfaces.yml"
      - ".github/workflows/lean-ci.yml"
      - ".gitattributes"
      - "requirements.txt"
  pull_request:
    paths:
      - "code/m1_interfaces/**"
      - "Lean/Geometry/M1Interfaces*.lean"
      - "Lean/Geometry/FlatDiamondNormalization.lean"
      - "Lean/Geometry/OrderingFractionFourDimensional.lean"
      - "paper/tex_fragments/M1_INTERFACES.tex"
      - "claims/claim_registry.yaml"
      - ".github/workflows/m1-interfaces.yml"
      - ".github/workflows/lean-ci.yml"
      - ".gitattributes"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q code/m1_interfaces
