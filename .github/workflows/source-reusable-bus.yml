name: Source Reusable Bus

on:
  push:
    branches: [main]
    paths:
      - "code/source_reusable_bus/**"
      - "code/source_routing/support_w12_l3.json"
      - "Lean/Geometry/SourceReusableBus*.lean"
      - "Lean/Geometry/SourceEncodedMemory.lean"
      - "Lean/ObserverPatchHolography/ScalarSeamRepair.lean"
      - "Lean/Geometry.lean"
      - "Lean/lean-toolchain"
      - "Lean/lakefile.lean"
      - "Lean/lake-manifest.json"
      - "requirements.txt"
      - ".gitattributes"
      - ".github/workflows/source-reusable-bus.yml"
      - ".github/workflows/lean-ci.yml"
  pull_request:
    paths:
      - "code/source_reusable_bus/**"
      - "code/source_routing/support_w12_l3.json"
      - "Lean/Geometry/SourceReusableBus*.lean"
      - "Lean/Geometry/SourceEncodedMemory.lean"
      - "Lean/ObserverPatchHolography/ScalarSeamRepair.lean"
      - "Lean/Geometry.lean"
      - "Lean/lean-toolchain"
      - "Lean/lakefile.lean"
      - "Lean/lake-manifest.json"
      - "requirements.txt"
      - ".gitattributes"
      - ".github/workflows/source-reusable-bus.yml"
      - ".github/workflows/lean-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned scientific dependencies
        run: pip install -r requirements.txt
      - name: Replay captured fixed-point histories and adversarial controls
        run: python -m pytest -q code/source_reusable_bus
