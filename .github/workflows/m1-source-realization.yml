name: M1 Source Realization

on:
  push:
    branches: [main]
    paths: &inputs
      - "code/m1_source_realization/**"
      - "docs/research/COHERENT_SOURCE_CLOCKS.md"
      - "code/source_selection_model/**"
      - "code/a5_closure/port_current_inner_certificate.py"
      - "code/m1_operational_clocks/check.py"
      - "docs/research/MASSIVE_OPERATIONAL_CLOCKS.md"
      - "claims/claim_registry.yaml"
      - "claims/axiom_registry.yaml"
      - "docs/AXIOM_REFERENCE.md"
      - "requirements.txt"
      - ".gitattributes"
      - ".github/workflows/m1-source-realization.yml"
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Replay source construction and hostile controls
        run: python -m pytest -q code/m1_source_realization
