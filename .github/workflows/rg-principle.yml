name: Record Gluing Principle

on:
  push:
    branches: [main]
    paths:
      - "code/rg_principle/**"
      - "Lean/Geometry/RecordGluingPrinciple*.lean"
      - "requirements.txt"
      - ".gitattributes"
      - ".github/workflows/rg-principle.yml"
  pull_request:
    paths:
      - "code/rg_principle/**"
      - "Lean/Geometry/RecordGluingPrinciple*.lean"
      - "requirements.txt"
      - ".gitattributes"
      - ".github/workflows/rg-principle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Replay circuits, algebra and adversarial controls
        run: python -m pytest -q code/rg_principle
