name: Source Native Stored Programs

on:
  push:
    branches: [main]
    paths:
      - "code/source_native_programs/**"
      - "code/source_read_acceptance/codec.py"
      - "code/source_read_acceptance/__init__.py"
      - "code/source_routing/support_w12_l3.json"
      - "code/source_read_routing/support_w12_l*.json"
      - "code/source_read_routing/controls/q3_baseline.json"
      - "evidence/source_net_causal_poset/build_causal_poset.py"
      - "evidence/source_net_causal_poset/carrier_source_net_receipt.json"
      - "Lean/**"
      - "docs/AXIOM_REFERENCE.md"
      - "claims/axiom_registry.yaml"
      - "requirements.txt"
      - ".gitattributes"
      - ".github/workflows/source-native-programs.yml"
      - ".github/workflows/lean-ci.yml"
  pull_request:
    paths:
      - "code/source_native_programs/**"
      - "code/source_read_acceptance/codec.py"
      - "code/source_read_acceptance/__init__.py"
      - "code/source_routing/support_w12_l3.json"
      - "code/source_read_routing/support_w12_l*.json"
      - "code/source_read_routing/controls/q3_baseline.json"
      - "evidence/source_net_causal_poset/build_causal_poset.py"
      - "evidence/source_net_causal_poset/carrier_source_net_receipt.json"
      - "Lean/**"
      - "docs/AXIOM_REFERENCE.md"
      - "claims/axiom_registry.yaml"
      - "requirements.txt"
      - ".gitattributes"
      - ".github/workflows/source-native-programs.yml"
      - ".github/workflows/lean-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q code/source_native_programs
  families:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Regenerate complete bank routes and q3 native histories
        run: python -m source_native_programs.family_build --workdir temp/native-program-witnesses --output temp/native-program-families.json
      - name: Independently verify all metrics, routes, q3 native histories and committed receipt
        run: python -m source_native_programs.family_verify --workdir temp/native-program-witnesses --families temp/native-program-families.json
