name: Lean CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Lean/**"
      - "claims/frozen_prediction_register.json"
      - "code/a5_fingerprint/spin_six_primitive_port_prediction.py"
      - "code/a5_fingerprint/runtime/spin_six_primitive_port_prediction_receipt.json"
      - "code/a5_fingerprint/test_spin_six_primitive_port_prediction.py"
      - "code/audit/test_fz_registry_gates.py"
      - "code/audit/test_e4_absence_guards.py"
      - "code/b15_matter_freeze/**"
      - "code/b16_lattices/**"
      - "docs/FROZEN_PREDICTION_LADDER.md"
      - "tools/build_fz_registry.py"
      - "tools/check_lean_native_decide_inventory.py"
      - ".github/workflows/lean-ci.yml"
  pull_request:
    paths:
      - "Lean/**"
      - "claims/frozen_prediction_register.json"
      - "code/a5_fingerprint/spin_six_primitive_port_prediction.py"
      - "code/a5_fingerprint/runtime/spin_six_primitive_port_prediction_receipt.json"
      - "code/a5_fingerprint/test_spin_six_primitive_port_prediction.py"
      - "code/audit/test_fz_registry_gates.py"
      - "code/audit/test_e4_absence_guards.py"
      - "code/b15_matter_freeze/**"
      - "code/b16_lattices/**"
      - "docs/FROZEN_PREDICTION_LADDER.md"
      - "tools/build_fz_registry.py"
      - "tools/check_lean_native_decide_inventory.py"
      - ".github/workflows/lean-ci.yml"

concurrency:
  group: lean-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Keep every per-change Lean job below the repository's 30-minute CI
    # ceiling. Internal budgets leave time to save resumable build artifacts
    # before this hard job timeout. Exceptional certificates are checked in
    # parallel, change-aware jobs below.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # FZ-11 resolves and hashes its original and repaired proof blobs at
          # their declared commits, then checks the repair is a direct child.
          fetch-depth: 0

      - name: Verify Lean CI runtime ceiling
        run: python3 tools/check_lean_ci_budget.py

      - name: Install elan
        run: |
          set -euo pipefail
          # Pinned elan release, verified against its published sha256.
          elan_version=v4.2.4
          elan_sha256=42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          cd "$RUNNER_TEMP"
          curl -sSfL -o elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${elan_version}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${elan_sha256}  elan.tar.gz" | sha256sum -c -
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Print toolchain
        working-directory: Lean
        run: |
          lean --version
          lake --version

      - name: Restore Lake build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Lean/.lake/build
            Lean/ObservableNormalForms/.lake/build
          key: lean-core-v3-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The last key survives lakefile edits (every new library changes the
          # hash). Lake re-checks each module trace against its source, imports
          # and toolchain, so a restored artifact is reused only when it is
          # still valid. Without this key the first run after a lakefile edit
          # starts cold and cannot finish inside the 18-minute budget.
          restore-keys: |
            lean-core-v3-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}-
            lean-core-v3-${{ runner.os }}-

      - name: Verify pinned dependency inputs
        working-directory: Lean
        run: |
          set -euo pipefail
          test -f lake-manifest.json
          grep -Fx 'leanprover/lean4:v4.29.1' lean-toolchain
          grep -F '"mathlib"' lake-manifest.json
          grep -F 'v4.29.1' lakefile.lean

      - name: Fetch Mathlib olean cache
        working-directory: Lean
        run: |
          set -euo pipefail
          status=0
          lake exe cache get 2>&1 | tee cache-get.log || status=$?
          tail -n 5 cache-get.log || true
          if [ "$status" -ne 0 ]; then
            echo "::warning::lake exe cache get exited with $status; continuing (Mathlib may build from source under the time budget)"
          fi

      - name: Detect changed Lean modules
        id: changed_modules
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          fi

          # Keep downstream trust audits explicit: compiling only a changed
          # dependency does not rerun an unchanged importer/axiom audit.
          # Additional changed modules are compiled directly; the exhaustive
          # umbrella build is intentionally nightly-only.
          targets=(
            "Geometry.M1QuantumTransportAxiomAudit"
            "Geometry.M1VacuumFidelityAxiomAudit"
            "Geometry.RecordGluingPrincipleAxiomAudit"
            "Geometry.M1InterfacesAxiomAudit"
            "Geometry.SourceEncodedMemoryAxiomAudit"
            "Geometry.SourceReusableBusAxiomAudit"
            "Geometry.SourceNativeUpdatesAxiomAudit"
            "Geometry.SourceReadSelectionAxiomAudit"
            "Geometry.SourceReadAcceptanceAxiomAudit"
            "Geometry.SourceAccumulatorAxiomAudit"
            "Geometry.SourceNativeProgramsAxiomAudit"
            "Geometry.SourceTemporalAcceptanceAxiomAudit"
            "Geometry.SourceCheckpointAxiomAudit"
            "Geometry.SourcePublicationAxiomAudit"
            "Geometry.SourceOperationReadsAxiomAudit"
            "Geometry.SourceSelectionLocalityAxiomAudit"
            "Geometry.SourceRecordGluingAxiomAudit"
            "Geometry.SourceCountLimitAxiomAudit"
            "Geometry.M1NecessityAxiomAudit"
            "Geometry.SourceRoutingRefinementAxiomAudit"
            "ObserverPatchHolography.EinsteinBranch.AxiomAudit"
            "A5PrimitivePortPrediction"
            "Geometry.SourcePassiveMemoryAxiomAudit"
          )
          if [ -n "$base" ] && [[ ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}"; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              # A module deleted in this change has no target to build.
              [ -f "$path" ] || continue
              rel="${path#Lean/}"
              case "$rel" in
                lakefile.lean|*/lakefile.lean) continue ;;
                OphGap.lean|OphGap/*) continue ;;
                # `OPHScreen.lean` is the import-only umbrella; its exhaustive
                # build remains nightly-only. The typed golden bridge has the
                # dedicated change-aware lane below.
                Screen/OPHScreen.lean|Screen/GoldenSectorPSL2F5Representations.lean) continue ;;
                # These source attachments are checked directly below; their
                # dependencies belong to the pinned thermodynamics library.
                Thermodynamics/NativeBinaryThermodynamics.lean|Thermodynamics/NativeRecordFourLaws.lean) continue ;;
                ObservableNormalForms/*) rel="${rel#ObservableNormalForms/}" ;;
                Screen/*) rel="${rel#Screen/}" ;;
                Thermodynamics/*) rel="${rel#Thermodynamics/}" ;;
              esac
              module="${rel%.lean}"
              module="${module//\//.}"
              targets+=("$module")
            done < <(git diff --name-only --diff-filter=d "$base" "$head" -- 'Lean/**/*.lean')
          fi

          {
            echo 'targets<<EOF'
            printf '%s\n' "${targets[@]}" | sort -u
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build changed Lean modules under time budget
        id: budget_build
        working-directory: Lean
        env:
          LEAN_TARGETS: ${{ steps.changed_modules.outputs.targets }}
        run: |
          set -euo pipefail
          status=0
          timeout 18m bash -c '
            set -euo pipefail
            while IFS= read -r target; do
              [ -n "$target" ] || continue
              echo "Building Lean target: $target"
              lake build "$target"
            done <<< "$LEAN_TARGETS"
            lake build FourLawAdequacySurface CofinalSpectralTailFamily
            lake env lean Thermodynamics/NativeBinaryThermodynamics.lean
            lake env lean Thermodynamics/NativeRecordFourLaws.lean
          ' 2>&1 | tee lake-build.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::changed-module build stopped with exit $status (124 = time budget reached)"
          fi

      - name: Fetch Mathlib olean cache for the neutral submission artifact
        if: steps.budget_build.outputs.status == '0'
        working-directory: Lean/ObservableNormalForms
        # The nested project pins the same Mathlib revision as the umbrella
        # project; without this fetch it compiles Mathlib from source and
        # exhausts its budget.
        run: |
          set -euo pipefail
          status=0
          lake exe cache get 2>&1 | tail -n 5 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::nested lake exe cache get exited with $status; continuing"
          fi

      - name: Build neutral submission artifact
        id: onf_build
        if: steps.budget_build.outputs.status == '0'
        working-directory: Lean/ObservableNormalForms
        run: |
          set -euo pipefail
          status=0
          timeout 5m lake build 2>&1 | tee onf-build.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::ObservableNormalForms build stopped with exit $status; progress is cached for the next run"
          fi

      - name: Save Lake build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.budget_build.outputs.status == '0' || steps.budget_build.outputs.status == '124'
        with:
          path: |
            Lean/.lake/build
            Lean/ObservableNormalForms/.lake/build
          key: lean-core-v3-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail when the changed-module build did not complete
        if: steps.budget_build.outputs.status != '0'
        env:
          BUILD_STATUS: ${{ steps.budget_build.outputs.status }}
        run: |
          if [ "$BUILD_STATUS" = "124" ]; then
            echo "The changed-module Lean build did not complete within its 18-minute budget." >&2
            echo "Split an oversized change or move an exceptional certificate to a dedicated lane." >&2
          else
            echo "The changed-module Lean build failed with exit $BUILD_STATUS; see lake-build.log in the build step." >&2
          fi
          exit 1

      - name: Fail when the artifact build did not complete
        if: steps.onf_build.outputs.status != '0'
        run: |
          echo "The ObservableNormalForms build did not complete within its budget." >&2
          echo "Progress was saved; re-run this workflow to resume from the cache." >&2
          exit 1

      - name: Run protected-obstruction finite explorer
        run: python3 Lean/ObservableNormalForms/tools/verify_protected_obstruction_models.py

      - name: Check zero proof debt
        working-directory: Lean
        run: |
          set -euo pipefail

          if rg -n '^\s*(sorry|admit)\b|(:=|\bby|\bexact|\brefine|·)\s*(sorry|admit)\b' \
              . --glob '*.lean' --glob '!**/.lake/**'; then
            echo "Unexpected Lean admission in the umbrella project." >&2
            exit 1
          fi

          if rg -n '^\s*axiom\b|\bby\s+native_decide\b' \
              ObserverPatchHolography/EinsteinBranch \
              --glob '*.lean'; then
            echo "Unexpected global axiom or native_decide in the Einstein branch." >&2
            exit 1
          fi

          # Repository-wide: no Lean file declares an axiom. The pattern
          # matches declaration shape, so docstring lines that begin with
          # the word "axiom" do not trip it.
          if rg -n '^\s*(@\[[^]]*\]\s*)?((private|protected|noncomputable|unsafe)\s+)*axiom\s+[^\s:({\[]+\s*[:({\[]' \
              . --glob '*.lean' --glob '!**/.lake/**'; then
            echo "Unexpected axiom declaration in the Lean tree." >&2
            exit 1
          fi

          if rg -n '^\s*(sorry|admit)\b|(:=|\bby|\bexact|\brefine|·)\s*(sorry|admit)\b' \
              ObservableNormalForms/ObservableNormalForms \
              --glob '*.lean'; then
            echo "Unexpected admission in neutral submission artifact." >&2
            exit 1
          fi

          sorry_warnings="$(grep -F 'declaration uses `sorry`' lake-build.log || true)"
          if [ -n "$sorry_warnings" ]; then
            echo "Unexpected Lean proof-debt state." >&2
            echo "Expected zero sorry warnings (the Primitives.lean admissions were discharged)." >&2
            echo "Actual sorry warnings:" >&2
            printf '%s\n' "$sorry_warnings" >&2
            exit 1
          fi

      - name: Replay Einstein-branch axiom audit
        working-directory: Lean
        # The audit is replayed explicitly because a warm cached build does
        # not re-elaborate the file, so its #print axioms output would be
        # absent from lake-build.log.
        run: |
          set -euo pipefail
          lake env lean \
            ObserverPatchHolography/EinsteinBranch/AxiomAudit.lean \
            2>&1 | tee axiom-audit.log
          grep -F "bare_consensus_not_einstein_complete' depends on axioms" axiom-audit.log
          grep -F "composedEinsteinBranch' depends on axioms" axiom-audit.log
          if grep -F 'sorryAx' axiom-audit.log; then
            echo "Unexpected sorryAx in the Einstein-branch audit." >&2
            exit 1
          fi

      - name: Check native_decide trust inventory
        run: python3 tools/check_lean_native_decide_inventory.py

      - name: Run the E4 stale-absence guards against the provisioned Mathlib
        # These guards read the pinned Mathlib source under Lean/.lake and
        # fail closed when it is absent, so they run only here, after the
        # build has provisioned it. The mandatory collection job excludes
        # them by path for the same reason (tools/run_mandatory_suite.py).
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest -q code/audit/test_e4_absence_guards.py

      - name: Replay FZ-11 primitive-port axiom audit
        # The vendored custody proofs under evidence/custody are parsed with
        # the official OpenTimestamps client (`ots info`, local only).
        run: |
          set -euo pipefail
          python3 -m pip install --quiet opentimestamps-client==0.7.2 opentimestamps==0.4.5 python-bitcoinlib==0.12.2
          python3 tools/build_fz_registry.py --check --verify-fz11-lean

      - name: Kernel-check the typed fixed-federation execution audit
        # The typed audit module pins the exact public theorem types of the
        # fixed-federation execution classification. The checker fails closed
        # when lake is unavailable, so it runs here after the Lean toolchain and
        # caches are provisioned rather than in the Python-only mandatory job.
        run: python3 tools/check_fixed_federation_execution_audit.py

      - name: Verify manifest unchanged
        run: git diff --exit-code -- Lean/lean-toolchain Lean/lakefile.lean Lean/lake-manifest.json

  golden_sector_psl2f5:
    name: Golden-sector PSL2F5 representations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Golden-sector PSL2F5-relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" "$head" -- \
              Lean/Screen/GoldenSectorPSL2F5Representations.lean \
              Lean/Screen/OPHScreen.lean \
              Lean/lean-toolchain Lean/lakefile.lean Lean/lake-manifest.json \
              .github/workflows/lean-ci.yml; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install elan
        if: steps.changes.outputs.required == 'true'
        run: |
          set -euo pipefail
          # Pinned elan release, verified against its published sha256.
          elan_version=v4.2.4
          elan_sha256=42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          cd "$RUNNER_TEMP"
          curl -sSfL -o elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${elan_version}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${elan_sha256}  elan.tar.gz" | sha256sum -c -
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Print toolchain
        if: steps.changes.outputs.required == 'true'
        working-directory: Lean
        run: |
          lean --version
          lake --version

      - name: Restore Golden-sector build cache
        if: steps.changes.outputs.required == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Lean/.lake/build
          key: golden-psl-v1-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The last key survives lakefile edits; Lake re-checks every trace.
          restore-keys: |
            golden-psl-v1-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json') }}-${{ github.run_id }}-
            golden-psl-v1-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json') }}-
            golden-psl-v1-${{ runner.os }}-

      - name: Fetch Mathlib olean cache
        if: steps.changes.outputs.required == 'true'
        working-directory: Lean
        run: |
          set -euo pipefail
          status=0
          lake exe cache get 2>&1 | tee cache-get-golden-psl.log || status=$?
          tail -n 5 cache-get-golden-psl.log || true
          if [ "$status" -ne 0 ]; then
            echo "::warning::lake exe cache get exited with $status; continuing under the proof budget"
          fi

      - name: Verify Golden-sector umbrella registration
        if: steps.changes.outputs.required == 'true'
        working-directory: Lean
        run: |
          set -euo pipefail
          grep -Fx 'import GoldenSectorPSL2F5Representations' Screen/OPHScreen.lean
          grep -F '`GoldenSectorPSL2F5Representations' lakefile.lean

      - name: Build Golden-sector PSL2F5 bridge under time budget
        id: golden_build
        if: steps.changes.outputs.required == 'true'
        working-directory: Lean
        run: |
          set -euo pipefail
          status=0
          timeout 23m lake build GoldenSectorPSL2F5Representations 2>&1 | tee golden-psl-build.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Golden-sector PSL2F5 bridge stopped with exit $status (124 = time budget reached, progress cached for the next run; any other exit saves no cache)"
          fi

      - name: Save Golden-sector build cache
        if: steps.changes.outputs.required == 'true' && (steps.golden_build.outputs.status == '0' || steps.golden_build.outputs.status == '124')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Lean/.lake/build
          key: golden-psl-v1-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail when the Golden-sector budget expired before completion
        if: steps.changes.outputs.required == 'true' && steps.golden_build.outputs.status != '0'
        run: |
          echo "The Golden-sector PSL2F5 bridge did not complete within its 23-minute build budget." >&2
          echo "Progress was saved; re-run this workflow to resume from the cache." >&2
          exit 1

      - name: Check Golden-sector proof debt
        if: steps.changes.outputs.required == 'true'
        run: |
          set -euo pipefail
          if rg -n '^\s*(sorry|admit)\b|(:=|\bby|\bexact|\brefine|·)\s*(sorry|admit)\b|^\s*axiom\b|\bby\s+native_decide\b' \
              Lean/Screen/GoldenSectorPSL2F5Representations.lean; then
            echo "Unexpected proof debt in the typed Golden-sector PSL2F5 bridge." >&2
            exit 1
          fi
          if grep -F 'sorryAx' Lean/golden-psl-build.log; then
            echo "Unexpected sorryAx in the typed Golden-sector PSL2F5 bridge audit." >&2
            exit 1
          fi

  ophgap:
    name: OphGap certificate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect OphGap-relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" "$head" -- \
              Lean/OphGap Lean/OphGap.lean \
              Lean/lean-toolchain Lean/lakefile.lean Lean/lake-manifest.json \
              .github/workflows/lean-ci.yml; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install elan
        if: steps.changes.outputs.required == 'true'
        run: |
          set -euo pipefail
          # Pinned elan release, verified against its published sha256.
          elan_version=v4.2.4
          elan_sha256=42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          cd "$RUNNER_TEMP"
          curl -sSfL -o elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${elan_version}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${elan_sha256}  elan.tar.gz" | sha256sum -c -
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Print toolchain
        if: steps.changes.outputs.required == 'true'
        working-directory: Lean
        run: |
          lean --version
          lake --version

      - name: Restore OphGap build cache
        if: steps.changes.outputs.required == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Lean/.lake/build/lib/lean/OphGap
            Lean/.lake/build/lib/lean/OphGap.*
            Lean/.lake/build/ir/OphGap
            Lean/.lake/build/ir/OphGap.*
          key: ophgap-v1-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The last key survives lakefile edits; Lake re-checks every trace.
          restore-keys: |
            ophgap-v1-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json') }}-
            ophgap-v1-${{ runner.os }}-

      - name: Fetch Mathlib olean cache
        if: steps.changes.outputs.required == 'true'
        working-directory: Lean
        run: |
          set -euo pipefail
          status=0
          lake exe cache get 2>&1 | tee cache-get-ophgap.log || status=$?
          tail -n 5 cache-get-ophgap.log || true
          if [ "$status" -ne 0 ]; then
            echo "::warning::lake exe cache get exited with $status; continuing under the proof budget"
          fi

      - name: Build OphGap under time budget
        id: ophgap_build
        if: steps.changes.outputs.required == 'true'
        working-directory: Lean
        run: |
          set -euo pipefail
          status=0
          timeout 23m lake build OphGap 2>&1 | tee ophgap-build.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::OphGap stopped with exit $status (124 = time budget reached, progress cached for the next run; any other exit saves no cache)"
          fi

      - name: Save OphGap build cache
        if: steps.changes.outputs.required == 'true' && (steps.ophgap_build.outputs.status == '0' || steps.ophgap_build.outputs.status == '124')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Lean/.lake/build/lib/lean/OphGap
            Lean/.lake/build/lib/lean/OphGap.*
            Lean/.lake/build/ir/OphGap
            Lean/.lake/build/ir/OphGap.*
          key: ophgap-v1-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail when the OphGap budget expired before completion
        if: steps.changes.outputs.required == 'true' && steps.ophgap_build.outputs.status != '0'
        run: |
          echo "The OphGap certificate did not complete within its 23-minute build budget." >&2
          echo "Progress was saved; re-run this workflow to resume from the cache." >&2
          exit 1

      - name: Check OphGap proof debt
        if: steps.changes.outputs.required == 'true'
        run: |
          set -euo pipefail
          if rg -n '^\s*(sorry|admit)\b|(:=|\bby|\bexact|\brefine|·)\s*(sorry|admit)\b|^\s*axiom\b|\bby\s+native_decide\b' \
              Lean/OphGap.lean Lean/OphGap --glob '*.lean'; then
            echo "Unexpected proof debt in OphGap." >&2
            exit 1
          fi
