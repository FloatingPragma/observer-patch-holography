name: Lean CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Lean/**"
      - "claims/frozen_prediction_register.json"
      - "code/a5_fingerprint/spin_six_primitive_port_prediction.py"
      - "code/a5_fingerprint/runtime/spin_six_primitive_port_prediction_receipt.json"
      - "code/a5_fingerprint/test_spin_six_primitive_port_prediction.py"
      - "code/audit/test_fz_registry_gates.py"
      - "code/audit/test_e4_absence_guards.py"
      - "code/b15_matter_freeze/**"
      - "code/b16_lattices/**"
      - "docs/FROZEN_PREDICTION_LADDER.md"
      - "tools/build_fz_registry.py"
      - "tools/check_lean_native_decide_inventory.py"
      - ".github/workflows/lean-ci.yml"
  pull_request:
    paths:
      - "Lean/**"
      - "claims/frozen_prediction_register.json"
      - "code/a5_fingerprint/spin_six_primitive_port_prediction.py"
      - "code/a5_fingerprint/runtime/spin_six_primitive_port_prediction_receipt.json"
      - "code/a5_fingerprint/test_spin_six_primitive_port_prediction.py"
      - "code/audit/test_fz_registry_gates.py"
      - "code/audit/test_e4_absence_guards.py"
      - "code/b15_matter_freeze/**"
      - "code/b16_lattices/**"
      - "docs/FROZEN_PREDICTION_LADDER.md"
      - "tools/build_fz_registry.py"
      - "tools/check_lean_native_decide_inventory.py"
      - ".github/workflows/lean-ci.yml"

concurrency:
  group: lean-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Keep every per-change Lean job below the repository's 30-minute CI
    # ceiling. Internal budgets leave time to save resumable build artifacts
    # before this hard job timeout. The expensive frozen OphGap certificate is
    # checked independently in the parallel, change-aware job below.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # FZ-11 resolves and hashes its original and repaired proof blobs at
          # their declared commits, then checks the repair is a direct child.
          fetch-depth: 0

      - name: Verify Lean CI runtime ceiling
        run: python3 tools/check_lean_ci_budget.py

      - name: Install elan
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Print toolchain
        working-directory: Lean
        run: |
          lean --version
          lake --version

      - name: Restore Lake build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Lean/.lake/build
            Lean/ObservableNormalForms/.lake/build
          key: lean-core-v3-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lean-core-v3-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}-
            lean-core-v3-${{ runner.os }}-
            lake2-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}
            lake2-${{ runner.os }}-

      - name: Verify pinned dependency inputs
        working-directory: Lean
        run: |
          set -euo pipefail
          test -f lake-manifest.json
          grep -Fx 'leanprover/lean4:v4.29.1' lean-toolchain
          grep -F '"mathlib"' lake-manifest.json
          grep -F 'v4.29.1' lakefile.lean

      - name: Fetch Mathlib olean cache
        working-directory: Lean
        run: |
          set -euo pipefail
          status=0
          lake exe cache get 2>&1 | tee cache-get.log || status=$?
          tail -n 5 cache-get.log || true
          if [ "$status" -ne 0 ]; then
            echo "::warning::lake exe cache get exited with $status; continuing (Mathlib may build from source under the time budget)"
          fi

      - name: Build under time budget
        id: budget_build
        working-directory: Lean
        run: |
          set -euo pipefail
          status=0
          timeout 18m lake build 2>&1 | tee lake-build.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::lake build stopped with exit $status (124 = time budget reached); progress is cached for the next run"
          fi

      - name: Fetch Mathlib olean cache for the neutral submission artifact
        if: steps.budget_build.outputs.status == '0'
        working-directory: Lean/ObservableNormalForms
        # The nested project pins the same Mathlib revision as the umbrella
        # project; without this fetch it compiles Mathlib from source and
        # exhausts its budget.
        run: |
          set -euo pipefail
          status=0
          lake exe cache get 2>&1 | tail -n 5 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::nested lake exe cache get exited with $status; continuing"
          fi

      - name: Build neutral submission artifact
        id: onf_build
        if: steps.budget_build.outputs.status == '0'
        working-directory: Lean/ObservableNormalForms
        run: |
          set -euo pipefail
          status=0
          timeout 5m lake build 2>&1 | tee onf-build.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::ObservableNormalForms build stopped with exit $status; progress is cached for the next run"
          fi

      - name: Save Lake build cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            Lean/.lake/build
            Lean/ObservableNormalForms/.lake/build
          key: lean-core-v3-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail when the time budget expired before completion
        if: steps.budget_build.outputs.status != '0'
        run: |
          echo "The Lake build did not complete within the time budget." >&2
          echo "Progress was saved; re-run this workflow to resume from the cache." >&2
          exit 1

      - name: Fail when the artifact build did not complete
        if: steps.onf_build.outputs.status != '0'
        run: |
          echo "The ObservableNormalForms build did not complete within its budget." >&2
          echo "Progress was saved; re-run this workflow to resume from the cache." >&2
          exit 1

      - name: Run protected-obstruction finite explorer
        run: python3 Lean/ObservableNormalForms/tools/verify_protected_obstruction_models.py

      - name: Check zero proof debt
        working-directory: Lean
        run: |
          set -euo pipefail

          if rg -n '^\s*(sorry|admit)\b|:=\s*(sorry|admit)\b' \
              . --glob '*.lean' --glob '!**/.lake/**'; then
            echo "Unexpected Lean admission in the umbrella project." >&2
            exit 1
          fi

          if rg -n '^\s*axiom\b|\bby\s+native_decide\b' \
              ObserverPatchHolography/EinsteinBranch \
              --glob '*.lean'; then
            echo "Unexpected global axiom or native_decide in the Einstein branch." >&2
            exit 1
          fi

          if rg -n '^\s*(sorry|admit)\b|:=\s*(sorry|admit)\b' \
              ObservableNormalForms/ObservableNormalForms \
              --glob '*.lean'; then
            echo "Unexpected admission in neutral submission artifact." >&2
            exit 1
          fi

          sorry_warnings="$(grep -F 'declaration uses `sorry`' lake-build.log || true)"
          if [ -n "$sorry_warnings" ]; then
            echo "Unexpected Lean proof-debt state." >&2
            echo "Expected zero sorry warnings (the Primitives.lean admissions were discharged)." >&2
            echo "Actual sorry warnings:" >&2
            printf '%s\n' "$sorry_warnings" >&2
            exit 1
          fi

      - name: Replay Einstein-branch axiom audit
        working-directory: Lean
        # The audit is replayed explicitly because a warm cached build does
        # not re-elaborate the file, so its #print axioms output would be
        # absent from lake-build.log.
        run: |
          set -euo pipefail
          lake env lean \
            ObserverPatchHolography/EinsteinBranch/AxiomAudit.lean \
            2>&1 | tee axiom-audit.log
          grep -F "bare_consensus_not_einstein_complete' depends on axioms" axiom-audit.log
          grep -F "composedEinsteinBranch' depends on axioms" axiom-audit.log
          if grep -F 'sorryAx' axiom-audit.log; then
            echo "Unexpected sorryAx in the Einstein-branch audit." >&2
            exit 1
          fi

      - name: Check native_decide trust inventory
        run: python3 tools/check_lean_native_decide_inventory.py

      - name: Run the E4 stale-absence guards against the provisioned Mathlib
        # These guards read the pinned Mathlib source under Lean/.lake and
        # fail closed when it is absent, so they run only here, after the
        # build has provisioned it. The mandatory collection job excludes
        # them by path for the same reason (tools/run_mandatory_suite.py).
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest -q code/audit/test_e4_absence_guards.py

      - name: Replay FZ-11 primitive-port axiom audit
        run: python3 tools/build_fz_registry.py --check --verify-fz11-lean

      - name: Verify manifest unchanged
        run: git diff --exit-code -- Lean/lean-toolchain Lean/lakefile.lean Lean/lake-manifest.json

  ophgap:
    name: OphGap certificate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect OphGap-relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" "$head" -- \
              Lean/OphGap Lean/OphGap.lean \
              Lean/lean-toolchain Lean/lakefile.lean Lean/lake-manifest.json \
              .github/workflows/lean-ci.yml; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install elan
        if: steps.changes.outputs.required == 'true'
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Print toolchain
        if: steps.changes.outputs.required == 'true'
        working-directory: Lean
        run: |
          lean --version
          lake --version

      - name: Restore OphGap build cache
        if: steps.changes.outputs.required == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            Lean/.lake/build/lib/lean/OphGap
            Lean/.lake/build/lib/lean/OphGap.*
            Lean/.lake/build/ir/OphGap
            Lean/.lake/build/ir/OphGap.*
          key: ophgap-v1-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ophgap-v1-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json') }}-
            ophgap-v1-${{ runner.os }}-
            lake2-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}
            lake2-${{ runner.os }}-

      - name: Fetch Mathlib olean cache
        if: steps.changes.outputs.required == 'true'
        working-directory: Lean
        run: |
          set -euo pipefail
          status=0
          lake exe cache get 2>&1 | tee cache-get-ophgap.log || status=$?
          tail -n 5 cache-get-ophgap.log || true
          if [ "$status" -ne 0 ]; then
            echo "::warning::lake exe cache get exited with $status; continuing under the proof budget"
          fi

      - name: Build OphGap under time budget
        id: ophgap_build
        if: steps.changes.outputs.required == 'true'
        working-directory: Lean
        run: |
          set -euo pipefail
          status=0
          timeout 23m lake build OphGap 2>&1 | tee ophgap-build.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::OphGap stopped with exit $status (124 = time budget reached); progress is cached for the next run"
          fi

      - name: Save OphGap build cache
        if: always() && steps.changes.outputs.required == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Lean/.lake/build/lib/lean/OphGap
            Lean/.lake/build/lib/lean/OphGap.*
            Lean/.lake/build/ir/OphGap
            Lean/.lake/build/ir/OphGap.*
          key: ophgap-v1-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail when the OphGap budget expired before completion
        if: steps.changes.outputs.required == 'true' && steps.ophgap_build.outputs.status != '0'
        run: |
          echo "The OphGap certificate did not complete within its 23-minute build budget." >&2
          echo "Progress was saved; re-run this workflow to resume from the cache." >&2
          exit 1

      - name: Check OphGap proof debt
        if: steps.changes.outputs.required == 'true'
        run: |
          set -euo pipefail
          if rg -n '^\s*(sorry|admit)\b|:=\s*(sorry|admit)\b|^\s*axiom\b|\bby\s+native_decide\b' \
              Lean/OphGap.lean Lean/OphGap --glob '*.lean'; then
            echo "Unexpected proof debt in OphGap." >&2
            exit 1
          fi
