name: Signed-source charge, rest energy and frame
on:
  push:
    branches: [main]
    paths: ['code/openwave_signed_source/**', 'code/openwave_static_signed_source/**', 'claims/openwave_signed_source.json', 'tools/build_openwave_signed_source_claim.py', '.github/workflows/openwave-signed-source.yml']
  pull_request:
    paths: ['code/openwave_signed_source/**', 'code/openwave_static_signed_source/**', 'claims/openwave_signed_source.json', 'tools/build_openwave_signed_source_claim.py', '.github/workflows/openwave-signed-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r code/openwave_static_signed_source/requirements.txt pytest
      - name: Published evidence custody and full experiment replay
        run: |
          python -B code/openwave_static_signed_source/replay.py --verify-only
          python -B code/openwave_static_signed_source/replay.py
      - name: Independent recomputation and claim ledger
        run: |
          python -m pytest -q code/openwave_signed_source
          python tools/build_openwave_signed_source_claim.py --check
