name: M1 Necessity

on:
  push:
    branches: [main]
    paths:
      - "code/m1_necessity/**"
      - "Lean/Geometry/M1Necessity*.lean"
      - "Lean/Geometry/FlatDiamondNormalization.lean"
      - ".gitattributes"
      - ".github/workflows/lean-ci.yml"
      - "claims/claim_registry.yaml"
      - "claims/dependency_graph.json"
      - "paper/tex_fragments/M1_NECESSITY.tex"
      - "paper/tex_fragments/CROSSING_READ_AREA_LAW.tex"
      - "paper/tex_fragments/SOURCE_NET_FLRW_RECORD_DENSITY.tex"
      - "paper/tex_fragments/SOURCE_METRIC_SCALAR_CONTINUUM.tex"
      - "requirements.txt"
      - ".github/workflows/m1-necessity.yml"
  pull_request:
    paths:
      - "code/m1_necessity/**"
      - "Lean/Geometry/M1Necessity*.lean"
      - "Lean/Geometry/FlatDiamondNormalization.lean"
      - ".gitattributes"
      - ".github/workflows/lean-ci.yml"
      - "claims/claim_registry.yaml"
      - "claims/dependency_graph.json"
      - "paper/tex_fragments/M1_NECESSITY.tex"
      - "paper/tex_fragments/CROSSING_READ_AREA_LAW.tex"
      - "paper/tex_fragments/SOURCE_NET_FLRW_RECORD_DENSITY.tex"
      - "paper/tex_fragments/SOURCE_METRIC_SCALAR_CONTINUUM.tex"
      - "requirements.txt"
      - ".github/workflows/m1-necessity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q code/m1_necessity
