name: Source Read Routing

on:
  push:
    branches: [main]
    paths:
      - "code/source_read_routing/**"
      - "code/support_wiring/**"
      - "evidence/support_wiring_776/**"
      - "code/source_routing/**"
      - "code/source_feedback_transport/**"
      - "evidence/source_net_causal_poset/**"
      - "Lean/Geometry/SourceReadRouting.lean"
      - "requirements.txt"
      - ".github/workflows/source-read-routing.yml"
  pull_request:
    paths:
      - "code/source_read_routing/**"
      - "code/support_wiring/**"
      - "evidence/support_wiring_776/**"
      - "code/source_routing/**"
      - "code/source_feedback_transport/**"
      - "evidence/source_net_causal_poset/**"
      - "Lean/Geometry/SourceReadRouting.lean"
      - "requirements.txt"
      - ".github/workflows/source-read-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned scientific dependencies
        run: pip install -r requirements.txt
      - name: Execute routed histories, inherited transport and adversarial controls
        run: python -m pytest -q code/source_read_routing code/source_feedback_transport/test_transport.py code/source_routing/test_routing.py
      - name: Compare all support captures with the audited wiring diagnostic
        run: python code/source_read_routing/support_comparison.py
      - name: Build producer and independent verifier for fresh execution
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra code/source_read_routing/produce.cpp -o "$RUNNER_TEMP/produce-routing"
          g++ -std=c++17 -O3 -Wall -Wextra code/source_read_routing/verify.cpp -o "$RUNNER_TEMP/verify-routing"
      - name: Reproduce all four controls through execution, accounting and packing
        if: runner.os == 'Linux'
        run: python code/source_read_routing/check_reproduction.py --producer "$RUNNER_TEMP/produce-routing" --verifier "$RUNNER_TEMP/verify-routing"
      - name: Reject regenerated semantic forgery with resealed checksums
        if: runner.os == 'Linux'
        run: ROUTING_VERIFIER="$RUNNER_TEMP/verify-routing" python -m pytest -q code/source_read_routing/test_regeneration.py
  replay:
    runs-on: ubuntu-latest
    # A q21 baseline alone took 27.6 minutes on a hosted runner. Each complete
    # history gets its own budget; no event or intervention is omitted.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        q: [13, 21]
        variant: [baseline, source]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned scientific dependencies
        run: pip install -r requirements.txt
      - name: Build producer and independent native verifier
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra code/source_read_routing/produce.cpp -o "$RUNNER_TEMP/produce-routing"
          g++ -std=c++17 -O3 -Wall -Wextra code/source_read_routing/verify.cpp -o "$RUNNER_TEMP/verify-routing"
      - name: Run independent native adversarial controls
        run: python code/source_read_routing/native_negative_controls.py --binary "$RUNNER_TEMP/verify-routing"
      - name: Regenerate and independently replay every original event
        run: python code/source_read_routing/regenerate.py evidence/source_net_causal_poset/routed_read_law/q${{ matrix.q }}_${{ matrix.variant }}.json --producer "$RUNNER_TEMP/produce-routing" --verifier "$RUNNER_TEMP/verify-routing"
