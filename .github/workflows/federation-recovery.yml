name: Federation Log Recovery

on:
  push:
    branches: [main]
    paths:
      - 'evidence/federation_recovery/**'
      - 'code/source_read_routing/**'
      - 'code/source_routing/support_w12_l3.json'
      - '.github/workflows/federation-recovery.yml'
  pull_request:
    paths:
      - 'evidence/federation_recovery/**'
      - 'code/source_read_routing/**'
      - 'code/source_routing/support_w12_l3.json'
      - '.github/workflows/federation-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Check blind recovery and adversarial controls
        run: python -m pytest -q evidence/federation_recovery
      - name: Independently reproduce the certificate and native tapes
        run: python evidence/federation_recovery/verify.py
