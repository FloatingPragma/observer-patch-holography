name: Temporary inherited replay diagnostics
on:
  push:
    branches: ['codex/oph-inherited-extension-diagnostics-20261113']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [openwave_beta_angular, openwave_rest_spectroscopy, openwave_colour_string]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_CORETYPE: Haswell
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install original pinned environment
        run: |
          python -m pip install -r model/requirements.txt
          echo "AUDIT_OUTPUT=$RUNNER_TEMP/inherited-diagnostic" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/inherited-diagnostic"
          python -m pip freeze > "$RUNNER_TEMP/inherited-diagnostic/environment.txt"
      - name: Capture original writer and exact cold comparison
        run: python .github/inherited-replay-diagnostic/capture.py '${{ matrix.package }}'
      - name: Retain original source and computation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inherited-${{ matrix.package }}
          path: ${{ runner.temp }}/inherited-diagnostic/
          include-hidden-files: true
          retention-days: 7
