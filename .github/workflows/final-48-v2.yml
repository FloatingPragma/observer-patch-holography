name: Temporary final affected-package scientific replay
on:
  push:
    branches: ['codex/oph-final-48-v2-20261113']
permissions:
  contents: read
jobs:
  original-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_CORETYPE: Haswell
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - name: Install original pinned environment
        run: |
          python -m pip install -r model/requirements.txt
          echo "AUDIT_OUTPUT=$RUNNER_TEMP/final-48-v2" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/final-48-v2"
          python -m pip freeze > "$RUNNER_TEMP/final-48-v2/environment.txt"
          cp .github/final-48-v2/manifest.json "$RUNNER_TEMP/final-48-v2/manifest.json"
      - name: Prepare pinned OpenWave kernel runtime
        if: false
        run: |
          python -m pip install taichi==1.7.4
          git init "$RUNNER_TEMP/oph-openwave-kernel"
          git -C "$RUNNER_TEMP/oph-openwave-kernel" fetch --depth=1 https://github.com/openwave-labs/openwave.git ef55175d04737e73c92f33f9f9cf3d17c593da54
          git -C "$RUNNER_TEMP/oph-openwave-kernel" checkout --detach FETCH_HEAD
          echo "OPH_OPENWAVE_ROOT=$RUNNER_TEMP/oph-openwave-kernel" >> "$GITHUB_ENV"
          echo "OPH_TAICHI_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          python -m pip freeze > "$RUNNER_TEMP/final-48-v2/environment.txt"
      - name: Execute all original cold checks with strict failure status
        run: python .github/final-48-v2/replay.py '${{ matrix.shard }}'
      - name: Retain actual check logs and immutable source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: final-48-v2-${{ matrix.shard }}
          path: ${{ runner.temp }}/final-48-v2/
          include-hidden-files: true
          retention-days: 7
