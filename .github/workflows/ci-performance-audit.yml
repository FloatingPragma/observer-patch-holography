name: Temporary public-baseline CI performance validation
on:
  push:
    branches: ['codex/oph-ci-performance-baseline-20261113']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_CORETYPE: Haswell
  PYTHONHASHSEED: '0'
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Prepare external audit reports
        run: |
          mkdir -p "$RUNNER_TEMP/performance"
          echo "AUDIT_OUTPUT=$RUNNER_TEMP/performance" >> "$GITHUB_ENV"
          cp .github/ci-performance-audit/manifest.json "$RUNNER_TEMP/performance/manifest.json"
      - name: Install exact retained model environment
        run: |
          python -m pip install -r model/requirements.txt
          python -m pip freeze > "$AUDIT_OUTPUT/environment.txt"
      - name: Authenticate public baseline and reviewed infrastructure
        run: python .github/ci-performance-audit/audit.py before
      - name: Exercise every infrastructure mutation test
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -W error tools/test_ci_affected_model.py tools/test_audit_receipt_sources.py tools/test_immutable_custody_replay.py tools/test_immutable_custody_pytest.py tools/test_exact_walsh.py tools/test_immutable_walsh_replay.py 2>&1 | tee "$AUDIT_OUTPUT/infrastructure-tests.log"
      - name: Check complete retained identification dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_receipt_sources.py --mode check --receipt model/particle_identification/completion_results.json --output "$AUDIT_OUTPUT/identification-source-preflight.json" 2>&1 | tee "$AUDIT_OUTPUT/preflight.log"
      - name: Run unchanged complete current source guard
        shell: bash
        run: |
          set -euo pipefail
          python -W error -m model.verify_current --hashes-only 2>&1 | tee "$AUDIT_OUTPUT/original-current-source-guard.log"
      - name: Plan actual Git change and a declared leaf-change probe
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_affected_model.py --base 71b7bab6e39b9b0d468c109f7a24802a8a584c7e --output "$AUDIT_OUTPUT/actual-git-change-plan.json" 2>&1 | tee "$AUDIT_OUTPUT/actual-git-change-plan.log"
          test -f model/openwave_su2_spectral/spectrum.py
          python tools/ci_affected_model.py --base 71b7bab6e39b9b0d468c109f7a24802a8a584c7e --changed model/openwave_su2_spectral/spectrum.py --output "$AUDIT_OUTPUT/declared-leaf-change-plan.json" 2>&1 | tee "$AUDIT_OUTPUT/declared-leaf-change-plan.log"
      - name: Authenticate unchanged inputs after all checks
        run: python .github/ci-performance-audit/audit.py after
      - name: Retain real infrastructure and custody evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-baseline-infrastructure
          path: ${{ runner.temp }}/performance/
          include-hidden-files: true
          retention-days: 7
  exact-twelve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Prepare external audit reports
        run: |
          mkdir -p "$RUNNER_TEMP/performance"
          echo "AUDIT_OUTPUT=$RUNNER_TEMP/performance" >> "$GITHUB_ENV"
          cp .github/ci-performance-audit/manifest.json "$RUNNER_TEMP/performance/manifest.json"
      - name: Install exact retained model environment
        run: |
          python -m pip install -r model/requirements.txt
          python -m pip freeze > "$AUDIT_OUTPUT/environment.txt"
      - name: Authenticate public baseline and reviewed infrastructure
        run: python .github/ci-performance-audit/audit.py before
      - name: Execute all twelve original scientific tests with exact arithmetic
        shell: bash
        run: |
          set -euo pipefail
          python tools/immutable_walsh_replay.py --audit "$AUDIT_OUTPUT/exact-twelve.json" 2>&1 | tee "$AUDIT_OUTPUT/exact-twelve.log"
      - name: Authenticate unchanged inputs after original scientific comparisons
        run: python .github/ci-performance-audit/audit.py after
      - name: Retain actual twelve-test and immutable-input evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-baseline-exact-twelve
          path: ${{ runner.temp }}/performance/
          include-hidden-files: true
          retention-days: 7
