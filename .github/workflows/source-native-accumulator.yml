name: Source Native Accumulator

on:
  push:
    branches: [main]
    paths:
      - "code/source_native_accumulator/**"
      - "code/source_read_acceptance/codec.py"
      - "code/source_read_acceptance/__init__.py"
      - "code/source_routing/support_w12_l3.json"
      - "Lean/**"
      - "docs/AXIOM_REFERENCE.md"
      - "claims/axiom_registry.yaml"
      - "requirements.txt"
      - ".gitattributes"
      - ".github/workflows/source-native-accumulator.yml"
      - ".github/workflows/lean-ci.yml"
  pull_request:
    paths:
      - "code/source_native_accumulator/**"
      - "code/source_read_acceptance/codec.py"
      - "code/source_read_acceptance/__init__.py"
      - "code/source_routing/support_w12_l3.json"
      - "Lean/**"
      - "docs/AXIOM_REFERENCE.md"
      - "claims/axiom_registry.yaml"
      - "requirements.txt"
      - ".gitattributes"
      - ".github/workflows/source-native-accumulator.yml"
      - ".github/workflows/lean-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Replay native arithmetic and adversarial controls
        run: python -m pytest -q code/source_native_accumulator
