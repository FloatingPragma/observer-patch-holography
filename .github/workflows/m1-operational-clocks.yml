name: M1 Operational Clocks

on:
  push:
    branches: [main]
    paths: &inputs
      - "code/m1_operational_clocks/**"
      - "docs/research/MASSIVE_OPERATIONAL_CLOCKS.md"
      - "code/m1_quantum_transport/tetra_model.py"
      - "code/m1_quantum_transport/tetra_check.py"
      - "code/m1_quantum_transport/DERIVATION.md"
      - "claims/claim_registry.yaml"
      - "requirements.txt"
      - ".gitattributes"
      - ".github/workflows/m1-operational-clocks.yml"
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Replay complete massive walk and adversarial clock controls
        run: python -m pytest -q code/m1_operational_clocks
