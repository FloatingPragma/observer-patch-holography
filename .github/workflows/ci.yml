name: CI

# The one required workflow: four jobs in parallel, each with a hard timeout, so a run finishes within about
# fifteen minutes and never takes thirty. The mandatory steps live in tools/run_mandatory_suite.py and the replay
# lanes in tools/ci_lanes.py; this file only names the jobs. Lean builds run in lean.yml.

on:
  push:
    branches: [main]
    tags: ['r*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'

jobs:
  ledgers:
    name: Ledgers and registers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Claim registry, premise countermodels and generated registers
        run: |
          python tools/check_claim_registry.py
          python -W error code/audit/test_basis_principle_boundaries.py
          python tools/build_premise_register.py --check
          python tools/build_observation_ledger.py --check
          python tools/build_selection_ledger.py --check
          python tools/build_claim_views.py --check
      - name: QFT/WZ theorem oracle
        working-directory: code/particles/calibration/q1_q4_wz_theorem_oracle
        run: |
          python verify_symbolic_q1_q4_wz.py
          python -m unittest -v test_theorem_oracle.py
      - name: Lean trust inventory and CI wiring
        run: |
          python tools/check_lean_native_decide_inventory.py
          python tools/check_lean_ci_budget.py
          python -m pytest -q tools/test_check_lean_ci_budget.py tools/test_mandatory_suite_shards.py tools/test_ci_lanes.py
      - name: Documentation policy on changed files
        if: github.event_name == 'pull_request'
        run: python tools/check_docs_policy.py --changed "${{ github.event.pull_request.base.sha }}"

  model:
    name: Executable model and candidate laws
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: python -m pip install -r model/requirements.txt
      - name: Fixed carrier, candidate laws and their evaluation
        run: |
          python -B -O -m model carrier
          python -B -m model --full
          python -B -O -m model run --law contrast_memory_spherical_v1
          python -B -O -m model run --law scalar_channel
          python -B -O -m model run --law scalar_channel --extended
          python -B -O -m model evaluate --check
      - name: Experiments
        run: |
          python -B -O -W error -m model.experiments.interval_echo_encounter.gateway
          python -B -O -W error -m model.experiments.interval_echo_encounter.gateway_complement
          python -B -O -W error -m model.experiments.interval_echo_encounter.gateway_message
          python -B -O -W error -m model.experiments.cage
          python -B -O -W error -m model.experiments.contact.material_radar
          python -B -O -W error -m model.experiments.contact.radar_checks
          python -B -O -W error -m model.experiments.contact.message_replay
          python -B -O -W error -m model.experiments.interval_echo_encounter.dwell
          python -B -O -W error -m model.experiments.interval_echo_encounter.dwell_scaling
          python -B -O -W error -m model.experiments.interval_echo_encounter.dwell_checks
          python -B -O -W error -m model.experiments.seam_program
          python -B -O -W error -m model.experiments.seam_program.preparation
          python -B -O -W error -m model.experiments.seam_program.receiver
          python -B -O -W error -m model.experiments.seam_program.clocked_run
          python -B -O -W error -m model.experiments.seam_program.free_marker
          python -B -O -m model.experiments.contrast_clock
          python -B -O -W error -m model.experiments.interval_echo_space.shells
          python -B -O -W error -m model.experiments.interval_echo_space.shell_spectroscopy
          python -B -O -W error -m model.experiments.interval_echo_space.shell_beats
      - name: Tests of the model
        run: python -B -m pytest -q -W error model
      - name: Formed-pair return and torus detector acquisitions
        run: |
          python -B -O -W error -m model.experiments.interval_echo_encounter.return_lines
          python -B -O -W error -m model.benchmarks.eight_slot_torus.formed_clocks.fringe
          python -B -O -W error -m model.benchmarks.eight_slot_torus.formed_clocks.fringe_resonance
          python -B -O -W error -m model.benchmarks.eight_slot_torus.formed_clocks.fringe_flight
          python -B -O -W error -m model.benchmarks.eight_slot_torus.formed_clocks.fringe_reference
      - name: Theory certificates on the model pins
        run: python tools/ci_lanes.py run --tier push --profile model --buckets 1 --bucket 0

  certificates:
    name: Certificates (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SHARDS: '6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Some audits resolve pinned commits; blobs are fetched lazily.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Mandatory steps
        run: python tools/run_mandatory_suite.py --shard-index ${{ matrix.shard }} --shard-count $SHARDS
      - name: Replay lanes
        run: python tools/ci_lanes.py run --tier push --profile root --buckets $SHARDS --bucket ${{ matrix.shard }}
      - name: Additional scientific evidence
        if: matrix.shard == 0
        run: |
          python -m pytest -q code/P_derivation/test_selection_accounting.py code/P_derivation/test_printed_pair_identity.py evidence/source_net_causal_poset/manifold_refinement/test_verify.py code/thermodynamics/test_collar_stationary_regressions.py code/thermodynamics/test_exact_count_chain_controls.py tools/test_check_docs_policy.py code/a5_closure/tests/test_galois_port_frame_certificate.py code/a5_closure/tests/test_port_gram_support_attachment.py
      - name: Sampled-manifold evidence
        if: matrix.shard == 0
        # The package vendors its own oph_exact and needs its root on the path.
        env:
          PYTHONPATH: ${{ github.workspace }}/evidence/source_net_causal_poset/manifold_sampled
        run: python -m pytest -q evidence/source_net_causal_poset/manifold_sampled/tests/test_exact_source_net_manifold_sampled.py evidence/source_net_causal_poset/manifold_sampled/tests/test_retained_receipt_mutations.py

  papers:
    name: Paper preview build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The Tectonic bundle server rate-limits shared runners (HTTP 429). The run-scoped key with a prefix restore
      # keeps warm runs off the network.
      - name: Cache the Tectonic bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-0.15.0-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tectonic-bundle-0.15.0-${{ runner.os }}-
      - name: Install pinned Tectonic
        uses: wtfjoke/setup-tectonic@5e1ba6e10229bd876c6594189bdab1a62b9d0b1c # v4.0.6
        with:
          tectonic-version: "0.15.0"
      - name: Install pinned Pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          pandoc-version: "3.8.3"
      - name: Install preview build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Validate source-bound canonical book PDF assets
        run: python tools/book_pdf_assets.py
      - name: Build every review PDF and the book, each within its warning budget
        run: |
          for attempt in 1 2 3; do
            if python tools/refresh_paper_release.py --preview && \
               python tools/build_book_pdf.py --output "${RUNNER_TEMP}/book.pdf"; then
              exit 0
            fi
            echo "preview build attempt ${attempt} failed; backing off before retry"
            sleep 60
          done
          exit 1
      - name: Require committed PDFs to match the source rebuild
        run: |
          set -o pipefail
          find paper flagship extra cosmology -maxdepth 1 -type f -name '*.pdf' -print0 \
            | while IFS= read -r -d '' pdf; do
                if ! git ls-files --error-unmatch -- "$pdf" >/dev/null 2>&1; then
                  echo "::error::Generated PDF is not committed: $pdf. Inspect it and add it to Git."
                  exit 1
                fi
              done
          if ! git diff --quiet -- paper flagship extra cosmology; then
            echo "::error::The committed PDFs or manifest do not match the source rebuild. Run 'python3 tools/refresh_paper_release.py --preview' and 'python3 tools/build_book_pdf.py', inspect the PDFs, then commit them."
            git diff --stat -- paper flagship extra cosmology
            exit 1
          fi
          if ! cmp --silent "${RUNNER_TEMP}/book.pdf" book/reverse-engineering-reality-book.pdf; then
            echo "::error::The committed book PDF does not match its manuscript. Run 'python3 tools/build_book_pdf.py' and commit the PDF."
            exit 1
          fi

  ci-ok:
    name: CI result
    if: always()
    needs: [ledgers, model, certificates, papers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required CI job ended with: $result"
              exit 1
            fi
          done
