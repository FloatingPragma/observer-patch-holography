permissions:
  contents: read

jobs:
  exact-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Offline source custody and historical prose-drift objects.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Independently verify the marked-triplet packet
        run: python3 -B code/a5_closure/verify_marked_triplet_attachment_independent.py
      - name: Verify the source-relative seed and degree cross-controls
        run: |
          python3 -B code/a5_closure/port_support_source_audit.py --check
          python3 -B code/a5_closure/verify_port_support_source_audit.py
          python3 -B code/a5_closure/equivariant_degree_crosscheck.py --check
          python3 -B code/a5_closure/verify_equivariant_degree_crosscheck.py
      - name: Verify the finite proper-code attachment probe
        run: |
          python3 -B code/a5_closure/proper_code_attachment_probe.py --check
          python3 -B code/a5_closure/verify_proper_code_attachment_independent.py
      - name: Verify the native-current C12 interface probe
        run: |
          python3 -B code/a5_closure/c12_current_attachment_probe.py --check
          python3 -B code/a5_closure/verify_c12_current_attachment_independent.py
      - name: Verify source coherent native access and its attachment boundary
        run: |
          python3 -B code/a5_closure/coherent_native_access_probe.py --check
          python3 -B code/a5_closure/verify_coherent_native_access_independent.py
      - name: Verify the restricted coherent decoder obstruction
        run: |
          python3 -B code/a5_closure/coherent_decoder_probe.py --check
          python3 -B code/a5_closure/verify_coherent_decoder_independent.py
      - name: Replay the admitted native coherent service controls
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: >-
          python3 -B -m pytest -q -W error
          model/native_interface/test_tomography.py
          model/native_interface/test_pointer.py
          model/compiled_native_interface/test_construction.py
      - name: Verify the current source inventory
        run: |
          python3 -B code/a5_closure/source_current_order_sensitive_inventory.py verify
          python3 -B code/a5_closure/verify_source_current_order_sensitive_inventory.py --inventory code/a5_closure/manifests/source_current_order_sensitive_inventory.json
      - name: Verify native scale and conditional RG transport
        run: |
          python3 -B code/angular_sprint/k7_gauge_scale_contract.py --check
          python3 -B code/angular_sprint/verify_k7_gauge_scale_contract_independent.py
      - name: Run exact interface hostile controls
        run: >-
          python3 -B -m pytest -q
          code/a5_closure/tests/test_marked_triplet_attachment_certificate.py
          code/a5_closure/tests/test_port_support_source_audit.py
          code/a5_closure/tests/test_equivariant_degree_crosscheck.py
          code/a5_closure/tests/test_proper_code_attachment_probe.py
          code/a5_closure/tests/test_c12_current_attachment_probe.py
          code/a5_closure/tests/test_coherent_native_access_probe.py
          code/a5_closure/tests/test_coherent_decoder_probe.py
          code/angular_sprint/test_k7_gauge_scale_contract.py
      - name: Check synchronized registers
        run: |
          python3 -B tools/build_premise_register.py --check
          python3 -B tools/build_model_theorem_map.py --check
          python3 -B tools/build_observation_ledger.py --check
          python3 -B tools/build_selection_ledger.py --check
          python3 -B tools/build_claim_views.py --check
