name: Coherent seam repair

on:
  pull_request:
    paths: ['model/**', 'Lean/**', 'paper/tex_fragments/EFFECTIVE_QUANTUM_COMPARISON.tex', 'evidence/**', '.github/workflows/coherent-seam-repair.yml']
  push:
    branches: [main]
    paths: ['model/**', 'Lean/**', 'paper/tex_fragments/EFFECTIVE_QUANTUM_COMPARISON.tex', 'evidence/**', '.github/workflows/coherent-seam-repair.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: python -m pip install -r model/requirements.txt
      - run: python -m model.coherent_seam_repair --check
      - run: python -m model.coherent_seam_repair.agreement --check
      - run: python -m model.coherent_seam_repair.protection --check
      - run: python -m pytest -q -W error model/coherent_seam_repair
      - run: python -m model.coherent_defect_wave --check
      - run: python -m model.coherent_defect_wave.background --check
      - run: python -m model.coherent_defect_wave.spectroscopy --check
      - run: python -m model.coherent_defect_wave.spatial --check
      - run: python -m model.coherent_defect_wave.species --check
      - run: python -m model.coherent_defect_wave.cubic_readout --check
      - run: python -m model.coherent_defect_wave.energy --check
      - run: python -m model.coherent_defect_wave.dispersion --check
      - run: python -m model.coherent_defect_wave.physical_attachment --check
      - run: python -m model.coherent_defect_wave.mobile_flux --check
      - run: python -m model.coherent_defect_wave.native_routing_join --check
      - run: python -m model.coherent_defect_wave.many_body_route --check
      - run: python -m model.coherent_defect_wave.mass_instrument --check
      - run: python -m model.coherent_defect_wave.propagating_native_join --check
      - run: python -m model.coherent_defect_wave.field_identity_audit --check
      - run: python -m model.coherent_defect_wave.chiral_source --check
      - run: python -m model.coherent_defect_wave.chiral_regulator --check
      - run: python -m model.coherent_defect_wave.chiral_higgs --check
      - run: python -m model.coherent_defect_wave.chiral_particle_map --check
      - run: python -m model.coherent_defect_wave.chiral_joint --check
      - run: python -m pytest -q -W error model/coherent_defect_wave --ignore=model/coherent_defect_wave/chiral_joint/two_cell --ignore=model/coherent_defect_wave/chiral_joint/periodic_family --ignore=model/coherent_defect_wave/chiral_joint/field_limit --ignore=model/coherent_defect_wave/chiral_joint/periodic_spectrum --ignore=model/coherent_defect_wave/chiral_joint/higgs_composites --ignore=model/coherent_defect_wave/chiral_joint/spectral_edges --ignore=model/coherent_defect_wave/chiral_joint/oriented_links --ignore=model/coherent_defect_wave/chiral_joint/neutral_mobility --ignore=model/coherent_defect_wave/chiral_joint/family_cell --ignore=model/coherent_defect_wave/chiral_joint/neutral_local_spectrum --ignore=model/coherent_defect_wave/chiral_joint/neutral_composite --ignore=model/coherent_defect_wave/chiral_joint/periodic_boson_records --ignore=model/coherent_defect_wave/chiral_joint/peter_weyl_links --ignore=model/coherent_defect_wave/chiral_joint/family_transport --ignore=model/coherent_defect_wave/chiral_joint/local_reference --ignore=model/coherent_defect_wave/chiral_joint/matter_induced_ring --ignore=model/coherent_defect_wave/chiral_joint/matter_induced_plaquette --ignore=model/coherent_defect_wave/chiral_joint/finite_clock

  constrained-spectrum:
    strategy:
      fail-fast: false
      matrix:
        package: [two_cell, periodic_family, field_limit, periodic_spectrum, higgs_composites, spectral_edges, oriented_links, neutral_mobility, family_cell, neutral_local_spectrum, neutral_composite, periodic_boson_records, peter_weyl_links, family_transport, local_reference, matter_induced_ring, matter_induced_plaquette, finite_clock]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: python -m pip install -r model/requirements.txt
      - run: python -m model.coherent_defect_wave.chiral_joint.${{ matrix.package }} --check
      - run: python -m pytest -q -W error model/coherent_defect_wave/chiral_joint/${{ matrix.package }}
