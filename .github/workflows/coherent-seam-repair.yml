name: Coherent seam repair

on:
  pull_request:
    paths: ['model/**', 'Lean/**', 'paper/tex_fragments/EFFECTIVE_QUANTUM_COMPARISON.tex', 'evidence/**', '.github/workflows/coherent-seam-repair.yml']
  push:
    branches: [main]
    paths: ['model/**', 'Lean/**', 'paper/tex_fragments/EFFECTIVE_QUANTUM_COMPARISON.tex', 'evidence/**', '.github/workflows/coherent-seam-repair.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: python -m pip install -r model/requirements.txt
      - run: python -m model.coherent_seam_repair --check
      - run: python -m model.coherent_seam_repair.agreement --check
      - run: python -m model.coherent_seam_repair.protection --check
      - run: python -m pytest -q -W error model/coherent_seam_repair
      - run: python -m model.particle_catalogue_correspondence --check
      - run: python -m pytest -q -W error model/particle_catalogue_correspondence
      - run: python -m model.finite_family_clock --check
      - run: python -m pytest -q -W error model/finite_family_clock
      - run: python -m model.defect_particle_classes --check
      - run: python -m pytest -q -W error model/defect_particle_classes
      - run: python -m model.native_quantum_service_bridge --check
      - run: python -m pytest -q -W error model/native_quantum_service_bridge
      - run: python -m model.coherent_defect_wave --check
      - run: python -m model.coherent_defect_wave.background --check
      - run: python -m model.coherent_defect_wave.spectroscopy --check
      - run: python -m model.coherent_defect_wave.spatial --check
      - run: python -m model.coherent_defect_wave.species --check
      - run: python -m model.coherent_defect_wave.cubic_readout --check
      - run: python -m model.coherent_defect_wave.energy --check
      - run: python -m model.coherent_defect_wave.dispersion --check
      - run: python -m model.coherent_defect_wave.physical_attachment --check
      - run: python -m model.coherent_defect_wave.mobile_flux --check
      - run: python -m model.coherent_defect_wave.native_routing_join --check
      - run: python -m model.coherent_defect_wave.many_body_route --check
      - run: python -m model.coherent_defect_wave.mass_instrument --check
      - run: python -m model.coherent_defect_wave.propagating_native_join --check
      - run: python -m model.coherent_defect_wave.field_identity_audit --check
      - run: python -m model.coherent_defect_wave.chiral_source --check
      - run: python -m model.coherent_defect_wave.chiral_regulator --check
      - run: python -m model.coherent_defect_wave.chiral_higgs --check
      - run: python -m model.coherent_defect_wave.chiral_particle_map --check
      - run: python -m model.coherent_defect_wave.chiral_joint --check
      - run: python -m pytest -q -W error model/coherent_defect_wave --ignore=model/coherent_defect_wave/chiral_joint/two_cell --ignore=model/coherent_defect_wave/chiral_joint/periodic_family --ignore=model/coherent_defect_wave/chiral_joint/field_limit --ignore=model/coherent_defect_wave/chiral_joint/periodic_spectrum --ignore=model/coherent_defect_wave/chiral_joint/higgs_composites --ignore=model/coherent_defect_wave/chiral_joint/spectral_edges --ignore=model/coherent_defect_wave/chiral_joint/oriented_links --ignore=model/coherent_defect_wave/chiral_joint/neutral_mobility --ignore=model/coherent_defect_wave/chiral_joint/family_cell --ignore=model/coherent_defect_wave/chiral_joint/neutral_local_spectrum --ignore=model/coherent_defect_wave/chiral_joint/neutral_composite --ignore=model/coherent_defect_wave/chiral_joint/periodic_boson_records --ignore=model/coherent_defect_wave/chiral_joint/peter_weyl_links --ignore=model/coherent_defect_wave/chiral_joint/family_transport --ignore=model/coherent_defect_wave/chiral_joint/local_reference --ignore=model/coherent_defect_wave/chiral_joint/matter_induced_ring --ignore=model/coherent_defect_wave/chiral_joint/matter_induced_plaquette --ignore=model/coherent_defect_wave/chiral_joint/finite_clock --ignore=model/coherent_defect_wave/chiral_joint/atomic_reference_control --ignore=model/coherent_defect_wave/chiral_joint/atomic_even_remainder --ignore=model/coherent_defect_wave/chiral_joint/charged_ground_exchange --ignore=model/coherent_defect_wave/chiral_joint/atomic_spin_geometry --ignore=model/coherent_defect_wave/chiral_joint/atomic_momentum_response --ignore=model/coherent_defect_wave/chiral_joint/ground_composite_response --ignore=model/coherent_defect_wave/chiral_joint/ground_scalar_response --ignore=model/coherent_defect_wave/chiral_joint/collective_spin_response --ignore=model/coherent_defect_wave/chiral_joint/interacting_ground_preparation --ignore=model/coherent_defect_wave/chiral_joint/interacting_charged_response --ignore=model/coherent_defect_wave/chiral_joint/interacting_charged_transport --ignore=model/coherent_defect_wave/chiral_joint/interacting_charge_localization --ignore=model/coherent_defect_wave/chiral_joint/interacting_charge_conjugation

  constrained-spectrum:
    strategy:
      fail-fast: false
      matrix:
        package: [two_cell, periodic_family, field_limit, periodic_spectrum, higgs_composites, spectral_edges, oriented_links, neutral_mobility, family_cell, neutral_local_spectrum, neutral_composite, periodic_boson_records, peter_weyl_links, family_transport, local_reference, matter_induced_ring, matter_induced_plaquette, finite_clock, atomic_reference_control, atomic_even_remainder, charged_ground_exchange, atomic_spin_geometry, atomic_momentum_response, ground_composite_response, ground_scalar_response, collective_spin_response, interacting_ground_preparation, interacting_charged_response, interacting_charged_transport, interacting_charge_localization, interacting_charge_conjugation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: python -m pip install -r model/requirements.txt
      - run: python -m model.coherent_defect_wave.chiral_joint.${{ matrix.package }} --check
      - run: python -m pytest -q -W error model/coherent_defect_wave/chiral_joint/${{ matrix.package }}

  collective-fields:
    strategy:
      fail-fast: false
      matrix:
        package: [interacting_block_propagation, interacting_block_quadrature, interacting_block_scattering, affine_gauss_source, affine_gauss_mobile, affine_gauss_spectrum, affine_gauss_full_spectrum, affine_gauss_spectrum_validation, affine_gauss_charged_clock, affine_gauss_clock_observables, native_abelian_field_join, native_abelian_energy_records, native_block_dirac, native_charge_resolution, native_higgs_spectral_join, native_charge_centroid, native_weak_current_interface, native_higgs_filtered_state, native_weak_current_response, native_higgs_current_response, native_wilson_maxwell, native_wilson_maxwell_refinement, native_quark_response, native_wilson_maxwell_ground, native_wilson_maxwell_ground_refinement, native_local_current_readout, native_quark_higgs_join, interacting_block_proca]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: python -m pip install -r model/requirements.txt
      - run: python -m model.${{ matrix.package }} --check
      - run: python -m pytest -q -W error model/${{ matrix.package }}
