name: Finite consensus settling

on:
  pull_request:
    paths: &inputs
      - 'code/consensus/**'
      # Other declared inputs read by the complete consensus test directory.
      - 'code/a5_closure/echosahedral_selector_certificate.py'
      - 'code/a5_closure/manifests/echosahedral_federation_reference.json'
      - 'code/a5_closure/receipts/echosahedral_federation_reference.receipt.json'
      - 'code/a5_closure/receipts/super_tannakian_matter_reference.receipt.json'
      - 'code/a5_closure/negative_controls/issue_565_negative_controls.json'
      - 'code/audit/receipt_promotion_registry.json'
      - 'code/particles/hierarchy/verify_screen_sieve_theorem.py'
      - 'code/particles/hierarchy/validators/validate_screen_sieve_certificate.py'
      - 'code/particles/hierarchy/certificates/R_screen_sieve_icosahedral_certificate.json'
      - 'paper/reality_as_consensus_protocol.tex'
      - 'paper/deriving_standard_model_gauge_structure_from_observer_overlap_consistency.tex'
      - 'paper/tex_fragments/PAPER.tex'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.github/workflows/consensus-settling.yml'
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernels-and-certificates:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Execute consensus kernels, certificates, exports and controls
        run: python -W error -m pytest -q code/consensus
