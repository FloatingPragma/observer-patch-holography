name: M1 Vacuum Fidelity

on:
  push:
    branches: [main]
    paths: &inputs
      - "code/m1_vacuum_fidelity/**"
      - "Lean/Geometry/M1VacuumFidelity*.lean"
      - "paper/tex_fragments/M1_VACUUM_FIDELITY.tex"
      - "paper/tex_fragments/SOURCE_SCALAR_QUANTUM.tex"
      - "paper/tex_fragments/RECORD_GLUING_PRINCIPLE.tex"
      - "Lean/Geometry/RecordGluingPrinciple.lean"
      - "claims/claim_registry.yaml"
      - "requirements.txt"
      - ".gitattributes"
      - ".github/workflows/m1-vacuum-fidelity.yml"
      - ".github/workflows/lean-ci.yml"
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Replay full-spectrum quantum evidence and hostile controls
        run: python -m pytest -q -W error code/m1_vacuum_fidelity
