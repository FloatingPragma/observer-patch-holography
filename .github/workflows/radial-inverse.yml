name: Finite radial inverse

on:
  pull_request:
    paths: &inputs
      - 'code/cosmology/oph_radial_lift_330.py'
      - 'code/cosmology/test_oph_radial_lift_330.py'
      - 'code/cosmology/test_radial_inverse_*.py'
      - 'code/cosmology/SIMULATOR_RADIAL_CONTRACT_330.md'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.github/workflows/radial-inverse.yml'
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inverse-and-controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Execute radial operators and independent constrained-minimum controls
        run: >-
          python -W error -m pytest -q
          code/cosmology/test_oph_radial_lift_330.py
          code/cosmology/test_radial_inverse_regressions.py
          code/cosmology/test_radial_inverse_controls.py
