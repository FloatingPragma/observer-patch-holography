name: Finite gauge transfer

on:
  push:
    branches: [main]
    paths: &inputs
      - 'code/yang_mills/**'
      - 'code/edge_sectors/**'
      - 'Lean/Screen/KogutSusskindFiberRateComparison.lean'
      - 'Lean/Screen/GaugeOrbitQuotientGap.lean'
      - 'extra/yang_mills_gap_clay_problem.tex'
      - 'claims/claim_registry.yaml'
      - 'claims/falsification_matrix.csv'
      - 'claims/novelty_matrix.csv'
      - 'paper/tex_fragments/PAPER.tex'
      - 'paper/deriving_standard_model_gauge_structure_from_observer_overlap_consistency.tex'
      - 'tools/test_post_r2029_audit_surfaces.py'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.gitattributes'
      - '.github/workflows/finite-gauge-transfer.yml'
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer-and-custody:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      # The committed-receipt test performs the full canonical grid once.
      # The remaining tests use bounded controls and validate retained custody.
      - name: Replay finite transfers, independent controls and companion bindings
        run: >-
          python -W error -m pytest -q
          code/yang_mills/tests/test_z2_finite_transfer_receipt.py
          code/yang_mills/tests/test_z2_finite_transfer_verifier.py
          code/yang_mills/tests/test_z2_transfer_spectrum.py
          code/yang_mills/tests/test_z2_kogut_precision.py
          code/yang_mills/tests/test_z2_full_space_controls.py
          code/yang_mills/tests/test_kogut_susskind_fiber_rate_instances.py

  edge-sector-ground-states:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Resolve finite edge sectors and check public evidence boundaries
        run: >-
          python -W error -m pytest -q
          code/edge_sectors
          tools/test_post_r2029_audit_surfaces.py
