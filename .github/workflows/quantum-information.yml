name: Finite quantum information
on:
  pull_request:
    paths:
      - 'code/quantum_information/**'
      - 'code/collar_alignment/**'
      - 'code/geometry/**'
      - 'code/maxent/**'
      - 'code/native_response/**'
      - 'code/source_selection_model/response.json'
      - 'paper/tex_fragments/SOURCE_RECORD_GLUING.tex'
      - 'requirements.txt'
      - '.github/workflows/quantum-information.yml'
  push:
    branches: [main]
    paths:
      - 'code/quantum_information/**'
      - 'code/collar_alignment/**'
      - 'code/geometry/**'
      - 'code/maxent/**'
      - 'code/native_response/**'
      - 'code/source_selection_model/response.json'
      - 'paper/tex_fragments/SOURCE_RECORD_GLUING.tex'
      - 'requirements.txt'
      - '.github/workflows/quantum-information.yml'
permissions:
  contents: read
jobs:
  entropy-and-collar-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: code
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q code/quantum_information code/collar_alignment code/geometry code/maxent code/native_response
