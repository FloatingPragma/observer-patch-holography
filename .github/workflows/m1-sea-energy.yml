name: M1 Filled Source Vacuum and Energy

on:
  push:
    branches: [main]
    paths: &inputs
      - "code/m1_sea_energy/**"
      - "docs/research/SOURCE_SEA_ENERGY.md"
      - ".github/workflows/m1-sea-energy.yml"
      - "code/m1_expander_archive/**"
      - "docs/research/FIXED_STRENGTH_PUBLIC_RECORDS.md"
      - ".github/workflows/m1-expander-archive.yml"
      - "code/m1_noisy_records/**"
      - "docs/research/NOISY_SOURCE_RECORDS.md"
      - ".github/workflows/m1-noisy-records.yml"
      - "code/m1_fixed_noise/**"
      - "docs/research/FIXED_RATE_SOURCE_READS.md"
      - ".github/workflows/m1-fixed-noise.yml"
      - "code/m1_fermionic_source/**"
      - "docs/research/FERMIONIC_SOURCE_CLOCKS.md"
      - ".github/workflows/m1-fermionic-source.yml"
      - "code/m1_source_realization/**"
      - "docs/research/COHERENT_SOURCE_CLOCKS.md"
      - ".github/workflows/m1-source-realization.yml"
      - "code/source_selection_model/**"
      - "code/a5_closure/port_current_inner_certificate.py"
      - "code/m1_operational_clocks/**"
      - "docs/research/MASSIVE_OPERATIONAL_CLOCKS.md"
      - ".github/workflows/m1-operational-clocks.yml"
      - "code/m1_quantum_transport/**"
      - "claims/claim_registry.yaml"
      - "claims/axiom_registry.yaml"
      - "docs/AXIOM_REFERENCE.md"
      - "requirements.txt"
      - ".gitattributes"
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: code
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Replay filled source vacuum, complete instruments and hostile controls
        run: python -m pytest -q code/m1_sea_energy
