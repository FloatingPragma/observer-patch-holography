name: Source Selection and Record Transport

on:
  pull_request:
    paths:
      - "code/source_selection_model/**"
      - "code/source_record_gluing/**"
      - "code/a5_closure/**"
      - "Lean/**"
      - "claims/axiom_registry.yaml"
      - "docs/AXIOM_REFERENCE.md"
      - "paper/tex_fragments/SOURCE_RECORD_GLUING.tex"
      - ".github/workflows/source-selection-model.yml"
      - ".github/workflows/lean-ci.yml"
  push:
    branches: [main]
    paths:
      - "code/source_selection_model/**"
      - "code/source_record_gluing/**"
      - "code/a5_closure/**"
      - "Lean/**"
      - "claims/axiom_registry.yaml"
      - "docs/AXIOM_REFERENCE.md"
      - "paper/tex_fragments/SOURCE_RECORD_GLUING.tex"
      - ".github/workflows/source-selection-model.yml"
      - ".github/workflows/lean-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The live verifier and CLI tamper tests each replay all 5.3M events.
    timeout-minutes: 30
    env:
      PYTHONPATH: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: pip install pytest sympy==1.13.3
      - run: python -m source_selection_model.verify
      - run: python -m source_record_gluing.verify
      - run: python -m pytest -q code/source_selection_model code/source_record_gluing
