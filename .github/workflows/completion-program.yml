name: Completion program contract

on:
  push:
    branches: [main]
    paths:
      - 'claims/completion_program.json'
      - 'claims/executable_model_hypothesis.json'
      - 'claims/claim_registry.yaml'
      - 'docs/COMPLETION_PROGRAM.md'
      - 'docs/OPH_EXECUTABLE_HYPOTHESIS.md'
      - 'tools/build_completion_program.py'
      - 'tools/test_completion_program.py'
      - 'model/completion/**'
      - 'model/clock_defect_energy/**'
      - 'model/local_repair_family/**'
      - 'model/exchange_sector/**'
      - 'model/particle_screening/**'
      - 'model/active_code_energy/**'
      - 'model/screened_recovery/**'
      - 'model/conserved_sector_action/**'
      - 'model/screened_transport/**'
      - 'model/moving_defect/**'
      - 'model/record_action/**'
      - 'model/particle_obstruction/**'
      - 'model/interacting_field/**'
      - 'model/bound_pair/**'
      - 'model/particle_clock/**'
      - 'model/field_regions/**'
      - 'model/field_stress/**'
      - 'model/field_tastes/**'
      - 'model/biased_reset/**'
      - 'model/band_clock/**'
      - 'model/native_localization/**'
      - 'model/native_program/**'
      - 'model/pair_cyclic_control/**'
      - 'model/recovery_elision/**'
      - 'model/biased_code_universality/**'
      - 'model/energy_identifiability/**'
      - 'model/regional_modular/**'
      - 'model/band_clock_budget/**'
      - 'model/compiled_native_history/**'
      - 'model/reference_observation/**'
      - 'model/native_fixed_algebra/**'
      - 'model/gauged_field/**'
      - 'model/full_fock_field/**'
      - 'model/field_thermal/**'
      - 'model/support_refinement/**'
      - 'model/reference_recovery/**'
      - 'model/particle_response/**'
      - 'model/charged_dynamics/**'
      - 'model/contact_scattering/**'
      - 'model/particle_comparison/**'
      - 'model/modular_flow/**'
      - 'model/full_fock_energy/**'
      - 'model/flux_response/**'
      - 'model/field_protocols/**'
      - 'model/dimer_family/**'
      - 'model/field_symmetry/**'
      - '.github/workflows/completion-program.yml'
  pull_request:
    paths:
      - 'claims/completion_program.json'
      - 'claims/executable_model_hypothesis.json'
      - 'claims/claim_registry.yaml'
      - 'docs/COMPLETION_PROGRAM.md'
      - 'docs/OPH_EXECUTABLE_HYPOTHESIS.md'
      - 'tools/build_completion_program.py'
      - 'tools/test_completion_program.py'
      - 'model/completion/**'
      - 'model/clock_defect_energy/**'
      - 'model/local_repair_family/**'
      - 'model/exchange_sector/**'
      - 'model/particle_screening/**'
      - 'model/active_code_energy/**'
      - 'model/screened_recovery/**'
      - 'model/conserved_sector_action/**'
      - 'model/screened_transport/**'
      - 'model/moving_defect/**'
      - 'model/record_action/**'
      - 'model/particle_obstruction/**'
      - 'model/interacting_field/**'
      - 'model/bound_pair/**'
      - 'model/particle_clock/**'
      - 'model/field_regions/**'
      - 'model/field_stress/**'
      - 'model/field_tastes/**'
      - 'model/biased_reset/**'
      - 'model/band_clock/**'
      - 'model/native_localization/**'
      - 'model/native_program/**'
      - 'model/pair_cyclic_control/**'
      - 'model/recovery_elision/**'
      - 'model/biased_code_universality/**'
      - 'model/energy_identifiability/**'
      - 'model/regional_modular/**'
      - 'model/band_clock_budget/**'
      - 'model/compiled_native_history/**'
      - 'model/reference_observation/**'
      - 'model/native_fixed_algebra/**'
      - 'model/gauged_field/**'
      - 'model/full_fock_field/**'
      - 'model/field_thermal/**'
      - 'model/support_refinement/**'
      - 'model/reference_recovery/**'
      - 'model/particle_response/**'
      - 'model/charged_dynamics/**'
      - 'model/contact_scattering/**'
      - 'model/particle_comparison/**'
      - 'model/modular_flow/**'
      - 'model/full_fock_energy/**'
      - 'model/flux_response/**'
      - 'model/field_protocols/**'
      - 'model/dimer_family/**'
      - 'model/field_symmetry/**'
      - '.github/workflows/completion-program.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  program:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/build_completion_program.py --check
      - run: python -m pytest -q --durations=10 -W error tools/test_completion_program.py model/completion model/clock_defect_energy model/local_repair_family model/exchange_sector model/particle_screening model/active_code_energy model/screened_recovery model/conserved_sector_action model/screened_transport
      - run: python -m pytest -q --durations=10 -W error model/moving_defect model/record_action model/particle_obstruction model/interacting_field
      - run: python -m model.moving_defect.experiment --check
      - run: python -m model.record_action.action --check
      - run: python -m model.particle_obstruction.classification --check
      - run: python -m model.interacting_field --check model/interacting_field/results.json
      - run: python -m pytest -q --durations=10 -W error model/bound_pair model/particle_clock model/field_regions model/field_stress model/field_tastes model/biased_reset
      - run: python -m model.bound_pair --check model/bound_pair/results.json
      - run: python -m model.particle_clock --check model/particle_clock/results.json
      - run: python -m model.field_regions --check model/field_regions/results.json
      - run: python -m model.field_stress --check model/field_stress/results.json
      - run: python -m model.field_tastes --check model/field_tastes/results.json
      - run: python -m model.biased_reset --check model/biased_reset/results.json
      - run: python -m pytest -q -W error model/band_clock model/native_localization model/native_program
      - run: python -m pytest -q -W error model/pair_cyclic_control model/recovery_elision model/biased_code_universality
      - run: python -m pytest -q -W error model/energy_identifiability model/regional_modular model/band_clock_budget model/compiled_native_history
      - run: python -m pytest -q -W error model/reference_observation model/native_fixed_algebra model/gauged_field model/full_fock_field
      - run: python -m pytest -q -W error model/field_thermal model/support_refinement
      - run: python -m model.support_refinement --check model/support_refinement/results.json
      - run: python -m model.band_clock_budget --check model/band_clock_budget/results.json
      - run: python -m model.band_clock --check model/band_clock/results.json
      - run: python -m model.native_localization.experiment --check model/native_localization/results.json
      - run: python -m model.native_program.receipt --check model/native_program/results.json
      - run: python -m model.completion.acceptance_audit --check
      - run: python -m model.completion.program_class_v2 --check
      - run: python -m model.completion.independent_program_review
      - run: python -m model.completion.finite_attachment_map --check

  particle-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --durations=10 -W error model/reference_recovery model/particle_response model/contact_scattering model/particle_comparison model/charged_dynamics
      - run: python -m pytest -q --durations=10 -W error model/modular_flow model/full_fock_energy model/flux_response model/field_protocols model/dimer_family
      - run: python -m pytest -q --durations=10 -W error model/field_symmetry
      - run: python -m model.field_symmetry --check model/field_symmetry/results.json
      - run: python -m model.flux_response --check model/flux_response/results.json
      - run: python -m model.particle_comparison.compare --check model/particle_comparison/results.json
      - run: python -m model.charged_dynamics.packet --check model/charged_dynamics/results.json
