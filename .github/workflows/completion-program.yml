permissions:
  contents: read

jobs:
  retained-custody:
    name: Retained 0194 custody regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch the immutable custody checkpoint
        run: git fetch --no-tags --depth=1 https://github.com/FloatingPragma/observer-patch-holography.git 0194fc685be3f7ba5f732681713c9cfd04e5290f
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the retained checkpoint requirements
        run: |
          git show 0194fc685be3f7ba5f732681713c9cfd04e5290f:model/requirements.txt > "$RUNNER_TEMP/oph-retained-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/oph-retained-requirements.txt"
      - name: Run all 53 original tests in their authenticated historical tree
        run: python tools/check_retained_completion_custody.py

  # These commands ran serially in one job of about 30 minutes; the same
  # commands run here as parallel jobs.
  retained-field-custody:
    name: Retained c7 field custody regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch the immutable field checkpoint
        run: git fetch --no-tags --depth=1 https://github.com/FloatingPragma/observer-patch-holography.git c7b09261853f5a3c5a67e21294c3d9511ed59fc7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the field checkpoint requirements
        run: |
          git show c7b09261853f5a3c5a67e21294c3d9511ed59fc7:model/requirements.txt > "$RUNNER_TEMP/oph-retained-field-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/oph-retained-field-requirements.txt"
      - name: Run all 31 original field tests in their authenticated tree
        run: python tools/check_retained_field_custody.py

  program-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/build_completion_program_current.py --check
      - name: Run all 73 original source-record tests in their authenticated tree
        run: python tools/check_retained_source_records_custody.py
      - name: Check the current owner and routing contracts
        run: python -m pytest -q -W error tools/test_field_current_documentary_owners.py tools/test_field_current_pointer_owners.py tools/test_field_current_record_manifests.py tools/test_retained_source_records_custody.py tools/test_diagnostic_parent_custody.py tools/test_numeric_evidence_medium.py
      # The old source-record CLIs belong to the separately executed 73-case
      # authority. Current science and current publication are checked separately.
      - run: python -m model.documentary_release_successor --check
      - run: python -m pytest -q --durations=10 -W error tools/test_completion_program.py model/completion model/clock_defect_energy
      - run: python -m model.completion.acceptance_audit --check
      - run: python -m model.completion.program_class_v2 --check
      - run: python -m model.completion.independent_program_review
      - run: python -m model.completion.finite_attachment_map --check
      - run: python -m model.completion.dynamics_response_campaign --check
      - run: python -m model.completion.spectrum_einstein_campaign --check
      - run: python -m model.completion.defect_geometry_campaign --check
      - run: python -m model.completion.radial_source_campaign --check
      - run: python code/particles/derive_radial_excitation_catalogue.py --check
      - run: python -m pytest -q -W error code/particles/test_radial_excitation_catalogue.py

  program-sectors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --durations=10 -W error model/exchange_sector model/particle_screening

  program-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --durations=10 -W error model/local_repair_family model/active_code_energy model/screened_recovery model/conserved_sector_action model/screened_transport
      - run: python tools/renew_diagnostic_parent_custody.py --check

  program-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --durations=10 -W error model/moving_defect model/record_action model/particle_obstruction model/interacting_field
      - run: python -m model.moving_defect.experiment --check
      - run: python -m model.record_action.action --check
      - run: python -m model.particle_obstruction.classification --check
      - run: python -m model.interacting_field --check model/interacting_field/results.json
      - run: python -m pytest -q --durations=10 -W error model/bound_pair model/particle_clock model/field_regions model/field_stress model/field_tastes model/biased_reset
      - run: python -m model.bound_pair --check model/bound_pair/results.json
      - run: python -m model.particle_clock --check model/particle_clock/results.json
      - run: python -m model.field_regions --check model/field_regions/results.json
      - run: python -m model.field_stress --check model/field_stress/results.json
      - run: python -m model.field_tastes --check model/field_tastes/results.json
      - run: python -m model.biased_reset --check model/biased_reset/results.json

  program-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -W error model/band_clock model/native_localization model/native_program
      - run: python -m pytest -q -W error model/pair_cyclic_control model/recovery_elision model/biased_code_universality
      - run: python -m pytest -q -W error model/energy_identifiability model/regional_modular model/band_clock_budget model/compiled_native_history
      - run: python -m pytest -q -W error model/regional_clock
      - run: python -m model.regional_clock.verify --check
      - run: python -m pytest -q -W error model/reference_observation model/native_fixed_algebra model/gauged_field model/full_fock_field
      - run: python -m pytest -q -W error model/field_thermal model/support_refinement
      - run: python -m model.support_refinement --check model/support_refinement/results.json
      - run: python -m model.band_clock_budget --check model/band_clock_budget/results.json
      - run: python -m model.band_clock --check model/band_clock/results.json
      - run: python -m model.native_localization.experiment --check model/native_localization/results.json
      - run: python -m model.native_program.receipt --check model/native_program/results.json

  particle-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --durations=10 -W error model/reference_recovery model/particle_response model/contact_scattering model/particle_comparison model/charged_dynamics model/particle_transport
      - run: python -m pytest -q --durations=10 -W error model/modular_flow model/full_fock_energy model/flux_response model/field_protocols model/dimer_family
      - run: python -m pytest -q --durations=10 -W error model/field_symmetry
      - run: python -m model.field_symmetry --check model/field_symmetry/results.json
      - run: python -m model.flux_response --check model/flux_response/results.json
      - run: python -m model.particle_comparison.compare --check model/particle_comparison/results.json
      - run: python -m model.charged_dynamics.packet --check model/charged_dynamics/results.json
      - run: python -m model.particle_transport.packet --check model/particle_transport/results.json

  protected-defects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --durations=10 -W error model/defect_protection model/defect_identity model/defect_energy
      - run: python -m model.defect_protection --check
      - run: python -m model.defect_identity.identity --check
      - run: python -m model.defect_energy --check

  native-field-readout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --durations=10 -W error model/defect_field_bridge model/defect_field_benchmark
      - run: python -m model.defect_field_bridge.bridge --check
      - run: python -m model.defect_field_bridge.colored --check
      - run: python -m model.defect_field_bridge.dynamics_packet --check
      - run: python -m model.defect_field_benchmark --check
      - run: python -m model.defect_field_benchmark.readout --check
      - run: python -m model.defect_field_bridge.joint --check
      - run: python -m model.defect_field_bridge.coherent_extension --check
      - run: python -m model.defect_field_bridge.full_domain --check

  native-field-dynamics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m model.defect_field_interactions.packet --check
      - run: python -m model.defect_field_clock --check
      - run: python -m model.defect_field_propagation --check
      - run: python -m pytest -q --durations=10 -W error model/defect_field_propagation model/defect_field_clock model/defect_field_interactions

  native-field-thermodynamics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m model.defect_field_modular --check
      - run: python -m model.defect_field_energy.packet --check
      - run: python -m pytest -q --durations=10 -W error model/defect_field_energy model/defect_field_modular
      - name: Check continuum and ordered-spin observer evidence
        run: python -m pytest -q --durations=10 -W error model/spin_goldstone_sector model/native_spin_observer model/lattice_weyl_response model/cubic_particle_channels model/lattice_modular_limit model/spin_particle_scaling model/native_ordered_ground model/spin_shell_diagnostic tools/test_replay_model_receipts.py tools/test_read_ordered_spin_energies.py tools/test_particle_mass_table.py
      - name: Cold replay continuum and ordered-spin receipts
        shell: python
        run: |
          import subprocess
          import sys
          for package in (
              "spin_goldstone_sector",
              "native_spin_observer",
              "lattice_weyl_response",
              "cubic_particle_channels",
              "lattice_modular_limit",
              "spin_particle_scaling",
              "native_ordered_ground",
              "spin_shell_diagnostic",
          ):
              subprocess.run([sys.executable, "-W", "error", "-m",
                              "model." + package, "--check"], check=True)
      - name: Check certified finite selection energy ratios
        run: python -W error tools/read_ordered_spin_energies.py --check model/completion/ordered_spin_energy_readout.json
      - name: Check canonical field, entropy, and particle table receipts
        run: |
          python -W error -m model.spin_canonical_energy --check
          python -W error -m model.shell_entropy_response --check
          python -W error tools/build_particle_mass_table.py --check

  finite-observables:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check composite poles, complete quadratic currents and finite entropy bounds
        run: python -m pytest -q -W error model/charged_composite_search model/quadratic_conservation model/prepared_regional_entropy model/completion/test_finite_observable_campaign.py
      - name: Cold replay the finite observable certificates
        run: |
          python -W error -m model.charged_composite_search --check
          python -W error -m model.quadratic_conservation --check
          python -W error -m model.prepared_regional_entropy --check
          python -W error -m model.completion.finite_observable_campaign --check

  native-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check complete spatial, detector, intervention and modular domains
        run: python -m pytest -q -W error model/composite_spatial_response model/native_composite_probe model/interacting_observation_process model/native_regional_modular model/completion/test_native_observation_campaign.py
      - name: Cold replay complete native observation certificates
        run: |
          python -W error -m model.composite_spatial_response --check
          python -W error -m model.native_composite_probe --check
          python -W error -m model.interacting_observation_process --check
          python -W error -m model.native_regional_modular --check
          python -W error -m model.completion.native_observation_campaign --check
