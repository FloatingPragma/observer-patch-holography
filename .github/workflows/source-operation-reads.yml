name: Source Operation Reads

on:
  pull_request:
    paths:
      - "code/source_operation_reads/**"
      - "Lean/**"
      - "docs/AXIOM_REFERENCE.md"
      - "claims/axiom_registry.yaml"
      - ".github/workflows/source-operation-reads.yml"
  push:
    branches: [main]
    paths:
      - "code/source_operation_reads/**"
      - "Lean/**"
      - "docs/AXIOM_REFERENCE.md"
      - "claims/axiom_registry.yaml"
      - ".github/workflows/source-operation-reads.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Enable long simulator paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: oph
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MarioPoneder/oph-physics-sim
          ref: 84d46b97b07965406c608e1465bec18b2a308372
          path: simulator
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: pip install -e "./simulator[test]"
      - name: Pinned simulator regressions and hostile inputs
        working-directory: simulator
        run: python -m pytest -q tests/test_primitive_source_reads.py tests/test_ordered_port_response_diagnostic.py tests/test_physical_h3_kms_source_capture.py
      - name: Independent retained evidence and hostile inputs
        working-directory: oph
        env:
          PYTHONPATH: code
        run: |
          python -m source_operation_reads.verify
          python -m pytest -q code/source_operation_reads
      - name: Recompute native operations from pinned source
        working-directory: oph
        env:
          PYTHONPATH: code
        run: python -m source_operation_reads.check_live ../simulator
