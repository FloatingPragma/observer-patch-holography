name: Finite Geometry Receipts

on:
  push:
    branches: [main]
    paths:
      - 'code/geometry/**'
      - 'requirements.txt'
      - '.github/workflows/geometry-receipts.yml'
  pull_request:
    paths:
      - 'code/geometry/**'
      - 'requirements.txt'
      - '.github/workflows/geometry-receipts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-geometry:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test all finite geometry evidence and adversarial controls
        run: python -m pytest -q code/geometry
