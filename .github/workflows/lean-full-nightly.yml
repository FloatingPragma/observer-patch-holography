name: Lean Full Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: lean-full-nightly
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install elan
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: Lean
        run: lake exe cache get

      - name: Build the complete default target set
        working-directory: Lean
        run: lake build

      - name: Build the frozen OphGap certificate
        working-directory: Lean
        run: lake build OphGap

      - name: Build the neutral submission artifact
        working-directory: Lean/ObservableNormalForms
        run: |
          lake exe cache get
          lake build
