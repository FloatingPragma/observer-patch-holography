name: Certificate Suites

# Keeps the release critical path below ten minutes. Push and pull-request runs
# recompute and verify both canonical exact certificates. The exhaustive
# mutation and negative-control matrix runs nightly and on manual dispatch.
# Both modes use pinned manifests/receipts under code/a5_closure/, so paper,
# ledger, and Markdown-only pushes are skipped by the path filter.
#
# The nightly full suite runs on both platforms, so environment, dependency,
# adversarial-control, and verifier-CLI drift is caught within a day.

on:
  push:
    branches: [main]
    paths:
      - "code/a5_closure/**"
      - "requirements.txt"
      - ".github/workflows/certificate-suites.yml"
  pull_request:
    paths:
      - "code/a5_closure/**"
      - "requirements.txt"
      - ".github/workflows/certificate-suites.yml"
  schedule:
    # Nightly full run (both platforms) guards against silent drift behind the
    # path filter. 06:17 UTC picks an off-peak, non-round minute.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  certificates:
    name: certificate suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Push/PR runs verify on ubuntu only (the certificates are
        # platform-independent exact arithmetic, and windows runner minutes bill
        # at 2x). The nightly/dispatch runs add windows for full coverage.
        os: >-
          ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
              && fromJSON('["ubuntu-latest", "windows-latest"]')
              || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recompute the canonical exact certificates
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python tools/run_mandatory_suite.py --certificate-smoke-only

      - name: Execute the exhaustive exact certificate suites
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python tools/run_mandatory_suite.py --certificates-only
