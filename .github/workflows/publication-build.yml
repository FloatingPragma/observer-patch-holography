name: Paper Preview Build

# Issue #542: compile every source-derived TeX root plus the reader-facing
# book, then enforce the anchored warning budget from the logs emitted by
# those exact builds.  The Tectonic version is pinned to the documented local
# environment so a moving engine release cannot silently redefine the budget.
# This is an artifact/reproducibility gate. It neither publishes nor requires a
# version bump, so maintainers can commit and inspect same-release PDF previews.
on:
  push:
    branches: [main]
    paths:
      - "Lean/**/*.lean"
      - "README.md"
      - "README_FR.md"
      - "paper/**"
      - "flagship/**"
      - "extra/**"
      - "book/**"
      - "assets/**"
      - "tools/build_tex_papers.py"
      - "tools/build_book_pdf.py"
      - "tools/book_pdf_assets.py"
      - "tools/check_lean_theorem_count.py"
      - "tools/generate_book_pdf_assets.py"
      - "tools/book_pdf_header.tex"
      - "tools/reproducible_build_env.py"
      - "tools/generate_paper_release_manifest.py"
      - "tools/refresh_paper_release.py"
      - "tools/validate_paper_release_manifest.py"
      - "tools/test_paper_release_manifest.py"
      - "REPRODUCE.md"
      - ".github/workflows/publication-build.yml"
  pull_request:
    paths:
      - "Lean/**/*.lean"
      - "README.md"
      - "README_FR.md"
      - "paper/**"
      - "flagship/**"
      - "extra/**"
      - "book/**"
      - "assets/**"
      - "tools/build_tex_papers.py"
      - "tools/build_book_pdf.py"
      - "tools/book_pdf_assets.py"
      - "tools/check_lean_theorem_count.py"
      - "tools/generate_book_pdf_assets.py"
      - "tools/book_pdf_header.tex"
      - "tools/reproducible_build_env.py"
      - "tools/generate_paper_release_manifest.py"
      - "tools/refresh_paper_release.py"
      - "tools/validate_paper_release_manifest.py"
      - "tools/test_paper_release_manifest.py"
      - "REPRODUCE.md"
      - ".github/workflows/publication-build.yml"
  workflow_dispatch:

jobs:
  paper-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The bundle server (data1.fullyjustified.net) rate-limits shared CI
      # runners (HTTP 429), which surfaced as spurious "font not loadable"
      # build failures. Caching Tectonic's bundle cache keeps warm runs off
      # the network. The key is run-scoped with a restore-keys prefix so each
      # run restores the newest prior cache and saves its own grown copy;
      # an exact fixed key would freeze the first (possibly partial) cache
      # forever, because actions/cache never overwrites an existing key.
      - name: Cache the Tectonic bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-0.15.0-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tectonic-bundle-0.15.0-${{ runner.os }}-

      - name: Install pinned Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "0.15.0"

      - name: Install pinned Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.8.3"

      - name: Install preview build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Validate source-bound canonical book PDF assets
        run: python tools/book_pdf_assets.py

      # Retried because the bundle server rate-limits shared runners; each
      # attempt extends the local Tectonic cache, so retries make progress
      # and the run-scoped cache save preserves it for the next run.
      - name: Build every review PDF and enforce its warning budget
        run: |
          for attempt in 1 2 3; do
            if python tools/refresh_paper_release.py --preview; then
              exit 0
            fi
            echo "preview build attempt ${attempt} failed; backing off before retry"
            sleep 90
          done
          exit 1

      # Built to a scratch path on purpose. The committed book PDF is a release artifact
      # rebuilt when a release is cut, and writing it here would both clobber it and, since
      # the canonical build stamps the manifest receipt alongside it, leave the receipt
      # disagreeing with the committed bytes. What CI needs is proof that the manuscript
      # compiles, stays inside its warning budget, and compiles to the same bytes twice.
      - name: Build the book and enforce its warning budget
        run: |
          for attempt in 1 2 3; do
            if python tools/build_book_pdf.py --output "${RUNNER_TEMP}/book-first.pdf"; then
              exit 0
            fi
            echo "book build attempt ${attempt} failed; backing off before retry"
            sleep 90
          done
          exit 1

      # The book PDF is deliberately absent from this check. Book updates are independent
      # of the paper release and land sporadically, and the committed PDF is rebuilt when a
      # release is cut, so between releases it legitimately lags the markdown. The book is
      # still built below and still has to build twice to the same bytes, so a broken or
      # non-deterministic manuscript is caught here; only the claim that the committed
      # bytes track every edit is dropped.
      - name: Require committed preview artifacts to match the source rebuild
        run: |
          if ! git diff --quiet -- paper flagship extra; then
            echo "::error::The committed PDFs or manifest do not match the source rebuild. No release bump is required. Run 'python3 tools/refresh_paper_release.py --preview' and 'python3 tools/build_book_pdf.py', inspect the PDFs, then commit the rebuilt artifacts."
            git diff --stat -- paper flagship extra
            exit 1
          fi

      - name: Record first-pass preview hashes
        run: |
          find paper flagship extra -maxdepth 1 -type f -name '*.pdf' -print0 \
            | sort -z \
            | xargs -0 sha256sum > "${RUNNER_TEMP}/papers-first.sha256"
          sha256sum paper/paper_release_manifest.json \
            > "${RUNNER_TEMP}/manifest-first.sha256"
          sha256sum "${RUNNER_TEMP}/book-first.pdf" | awk '{print $1}' \
            > "${RUNNER_TEMP}/book-first.sha256"

      - name: Rebuild every preview artifact
        run: |
          python tools/refresh_paper_release.py --preview
          python tools/build_book_pdf.py --output "${RUNNER_TEMP}/book-second.pdf"

      - name: Require byte-identical second pass
        run: |
          find paper flagship extra -maxdepth 1 -type f -name '*.pdf' -print0 \
            | sort -z \
            | xargs -0 sha256sum > "${RUNNER_TEMP}/papers-second.sha256"
          sha256sum paper/paper_release_manifest.json \
            > "${RUNNER_TEMP}/manifest-second.sha256"
          sha256sum "${RUNNER_TEMP}/book-second.pdf" | awk '{print $1}' \
            > "${RUNNER_TEMP}/book-second.sha256"
          diff -u "${RUNNER_TEMP}/papers-first.sha256" "${RUNNER_TEMP}/papers-second.sha256"
          diff -u "${RUNNER_TEMP}/manifest-first.sha256" "${RUNNER_TEMP}/manifest-second.sha256"
          diff -u "${RUNNER_TEMP}/book-first.sha256" "${RUNNER_TEMP}/book-second.sha256"
