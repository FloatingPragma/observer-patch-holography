name: Independent Postdictions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduction:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      PYTHONPATH: code
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q code/independent_postdictions
      - name: Check conditional particle comparisons and source boundaries
        run: >-
          python -m pytest -q
          code/particles/calibration/test_d11_criticality_comparison.py
          code/particles/flavor/test_audit_conditional_quark_ratio.py
          code/particles/flavor/test_compare_conditional_quark_masses.py
          code/particles/flavor/test_quark_lane_closure_contract.py
          code/particles/flavor/test_quark_p_driven_shared_evaluator_contract.py
          code/particles/leptons/test_koide_circulant_identity.py
