name: Temporary exact publication replay
on:
  push:
    branches: ['codex/oph-twelfth-publication-replay-20261113']
permissions:
  contents: read
jobs:
  original-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Initialize external artifact directory
        run: |
          echo "AUDIT_OUTPUT=$RUNNER_TEMP/oph-publication-output" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/oph-publication-output"
          cp .github/publication-replay-audit/manifest.json "$RUNNER_TEMP/oph-publication-output/manifest.json"
      - name: Install both retained reproduction environments
        run: |
          python -m venv "$RUNNER_TEMP/oph-publication-core"
          "$RUNNER_TEMP/oph-publication-core/bin/python" -m pip install -r requirements.txt
          python -m venv "$RUNNER_TEMP/oph-publication-model"
          "$RUNNER_TEMP/oph-publication-model/bin/python" -m pip install -r model/requirements.txt
      - name: Authenticate full immutable source inventory
        run: |
          "$RUNNER_TEMP/oph-publication-core/bin/python" .github/publication-replay-audit/audit.py before
          "$RUNNER_TEMP/oph-publication-core/bin/python" -m pip freeze > "$AUDIT_OUTPUT/core-environment.txt"
          "$RUNNER_TEMP/oph-publication-model/bin/python" -m pip freeze > "$AUDIT_OUTPUT/model-environment.txt"
      - name: Original complete publication producer
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/oph-publication-core/bin/python" code/particles/scripts/build_postdiction_ledger.py 2>&1 | tee "$AUDIT_OUTPUT/original-write.log"
          cp code/particles/runs/status/postdiction_ledger.json "$AUDIT_OUTPUT/postdiction_ledger.json"
          cp docs/POSTDICTION_LEDGER.md "$AUDIT_OUTPUT/POSTDICTION_LEDGER.md"
          "$RUNNER_TEMP/oph-publication-core/bin/python" .github/publication-replay-audit/audit.py after-write
      - name: Independent original cold publication check
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/oph-publication-core/bin/python" code/particles/scripts/build_postdiction_ledger.py --check 2>&1 | tee "$AUDIT_OUTPUT/original-check.log"
          "$RUNNER_TEMP/oph-publication-core/bin/python" .github/publication-replay-audit/audit.py after-check
      - name: Original complete current artifact and source guard
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/oph-publication-model/bin/python" -m model.verify_current --hashes-only 2>&1 | tee "$AUDIT_OUTPUT/current-source-guard.log"
          "$RUNNER_TEMP/oph-publication-core/bin/python" .github/publication-replay-audit/audit.py after-guard
      - name: Retain actual outputs and source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original-publication-replay
          path: ${{ runner.temp }}/oph-publication-output/
          include-hidden-files: true
          retention-days: 7
