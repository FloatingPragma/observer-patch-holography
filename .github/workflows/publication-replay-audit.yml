name: Temporary scientific replay diagnostics
on:
  push:
    branches: ['codex/oph-thirteenth-science-diagnostic-20261113']
permissions:
  contents: read
jobs:
  source-science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Initialize science artifact directory
        run: |
          echo "AUDIT_OUTPUT=$RUNNER_TEMP/oph-science-output" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/oph-science-output"
      - name: Install retained pinned model environment
        run: |
          python -m pip install -r model/requirements.txt
          mkdir -p "$AUDIT_OUTPUT"
          python -m pip freeze > "$AUDIT_OUTPUT/environment.txt"
      - name: Authenticate exact immutable inputs
        run: python .github/publication-replay-audit/audit.py before
      - name: Capture exact resolved-core writer diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cp model/openwave_resolved_core/results.json "$AUDIT_OUTPUT/core-before.json"
          python -m model.openwave_resolved_core --write 2>&1 | tee "$AUDIT_OUTPUT/core-write.log"
          cp model/openwave_resolved_core/results.json "$AUDIT_OUTPUT/core-after.json"
          cp "$AUDIT_OUTPUT/core-before.json" model/openwave_resolved_core/results.json
          git diff --exit-code
      - name: Independently replay remaining source packages
        shell: bash
        run: |
          set -euo pipefail
          for scientific_name in dirac_field_connection gravity_unit_constraint horizon_capacity su2_propagation; do
            python -m "model.openwave_${scientific_name}" --check 2>&1 | tee "$AUDIT_OUTPUT/${scientific_name}.log"
          done
      - name: Scientific and public projection regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -W error model/openwave_baryon_dispersion model/openwave_cluster_bandwidth model/openwave_nuclear_isospin model/openwave_clock_phase_resource model/openwave_quotient_homotopy model/openwave_resolved_core model/openwave_dirac_field_connection model/openwave_gravity_unit_constraint model/openwave_horizon_capacity model/openwave_su2_propagation tools/test_native_physical_results.py 2>&1 | tee "$AUDIT_OUTPUT/focused-tests.log"
          python .github/publication-replay-audit/audit.py before
          git diff --exit-code
      - name: Retain independent Linux proof and calculation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: current-science-diagnostics
          path: ${{ runner.temp }}/oph-science-output/
          include-hidden-files: true
          retention-days: 7
