name: Source Publication Selection

on:
  push:
    branches: [main]
    paths:
      - "code/source_publication_selection/**"
      - "code/source_temporal_acceptance/**"
      - "Lean/**"
      - "docs/AXIOM_REFERENCE.md"
      - "claims/axiom_registry.yaml"
      - ".github/workflows/source-publication-selection.yml"
      - ".github/workflows/lean-ci.yml"
  pull_request:
    paths:
      - "code/source_publication_selection/**"
      - "code/source_temporal_acceptance/**"
      - "Lean/**"
      - "docs/AXIOM_REFERENCE.md"
      - "claims/axiom_registry.yaml"
      - ".github/workflows/source-publication-selection.yml"
      - ".github/workflows/lean-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m source_publication_selection.verify
      - run: python -m pytest -q code/source_publication_selection
