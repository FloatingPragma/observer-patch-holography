<svg xmlns="http://www.w3.org/2000/svg" width="6.3in" height="1.16in" viewBox="0 0 660 122" role="img" aria-labelledby="title desc">
<title id="title">Two signal speeds on one calibrated scale</title>
<desc id="desc">The addressed nonce command travels at 1.000 radar-range unit per home tick. The free gapless packet travels at 0.499350, measured using the same distance scale.</desc>
<g font-family="Arial, Helvetica, sans-serif" fill="#18333B">
<rect x="0" y="0" width="660" height="122" fill="white"/>
<g stroke="#D1DCDB" stroke-width="1"><path d="M215 10 V79 M389 10 V79 M563 10 V79 M215 79 H563"/></g>
<g font-size="15" font-weight="bold">
<text x="7" y="30">Addressed nonce command</text><text x="7" y="60">Free gapless packet</text>
</g>
<path d="M215 26 H563" stroke="#A34F2B" stroke-width="5" />
<path d="M215 56 H388.7738" stroke="#006E68" stroke-width="5" />
<circle cx="563" cy="26" r="4.3" fill="#A34F2B"/><circle cx="388.7738" cy="56" r="4.3" fill="#006E68"/>
<g font-size="15" font-weight="bold">
<text x="575" y="31" fill="#A34F2B">1.000</text><text x="400" y="61" fill="#006E68">0.499350</text>
</g>
<g font-size="13" fill="#415A60" text-anchor="middle">
<text x="215" y="95">0</text><text x="389" y="95">0.5</text><text x="563" y="95">1</text>
<text x="389" y="117" font-size="14">Speed (radar-range units per home tick)</text>
</g></g></svg>
