    <dc:title>Convergence of the scalar field and the role of each spatial direction</dc:title>
    <dc:description>Exact field errors fall from 0.04414 to 0.000671 as resolution rises from 16 to 128. At 128, held-out RMS error is 0.0011 for three derivatives and above 0.31 when any one is omitted.</dc:description>
