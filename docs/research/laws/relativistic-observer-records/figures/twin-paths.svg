<svg xmlns="http://www.w3.org/2000/svg" width="6.3in" height="3.0068in" viewBox="0 0 660 315" role="img" aria-labelledby="title desc">
<title id="title">Two clocks meet twice</title><desc id="desc">Illustrative spacetime diagram in home-frame units. The traveler covers three light-ticks outward in five home ticks and returns in five more. At reunion the home clock reads ten and the traveler clock reads eight.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="660" height="315" fill="white"/>
<text x="10" y="20" font-size="16" font-weight="700" fill="#18333B" text-anchor="start" letter-spacing="0">Home-frame time (ticks)</text>
<line x1="53" y1="54" x2="300" y2="54" stroke="#D1DCDB" stroke-width="1" stroke-dasharray="3 4"/>
<text x="43" y="59" font-size="14" font-weight="400" fill="#415A60" text-anchor="end" letter-spacing="0">10</text>
<line x1="53" y1="154.0" x2="300" y2="154.0" stroke="#D1DCDB" stroke-width="1" stroke-dasharray="3 4"/>
<text x="43" y="159.0" font-size="14" font-weight="400" fill="#415A60" text-anchor="end" letter-spacing="0">5</text>
<line x1="53" y1="254" x2="300" y2="254" stroke="#D1DCDB" stroke-width="1" stroke-dasharray="3 4"/>
<text x="43" y="259" font-size="14" font-weight="400" fill="#415A60" text-anchor="end" letter-spacing="0">0</text>
<line x1="53" y1="37" x2="53" y2="255" stroke="#415A60" stroke-width="1.2"/>
<path d="M49 43 L53 36 L57 43" stroke="#415A60" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="53" y1="254" x2="309" y2="254" stroke="#415A60" stroke-width="1.2"/>
<path d="M302 250 L310 254 L302 258" stroke="#415A60" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="76" y1="254" x2="76" y2="259" stroke="#415A60" stroke-width="1"/>
<text x="76" y="277" font-size="14" font-weight="400" fill="#415A60" text-anchor="middle" letter-spacing="0">0</text>
<line x1="235" y1="254" x2="235" y2="259" stroke="#415A60" stroke-width="1"/>
<text x="235" y="277" font-size="14" font-weight="400" fill="#415A60" text-anchor="middle" letter-spacing="0">3</text>
<text x="55" y="302" font-size="15" font-weight="700" fill="#18333B" text-anchor="start" letter-spacing="0">Distance from home (light-ticks)</text>
<line x1="76" y1="54" x2="76" y2="254" stroke="#18333B" stroke-width="3"/>
<line x1="235" y1="154.0" x2="235" y2="254" stroke="#D1DCDB" stroke-width="1" stroke-dasharray="3 4"/>
<path d="M76 254 L235 154.0 L76 54" stroke="#006E68" stroke-width="3.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="72" y1="234" x2="80" y2="234" stroke="#18333B" stroke-width="1.8"/>
<line x1="72" y1="214" x2="80" y2="214" stroke="#18333B" stroke-width="1.8"/>
<line x1="72" y1="194" x2="80" y2="194" stroke="#18333B" stroke-width="1.8"/>
<line x1="72" y1="174" x2="80" y2="174" stroke="#18333B" stroke-width="1.8"/>
<line x1="72" y1="154" x2="80" y2="154" stroke="#18333B" stroke-width="1.8"/>
<line x1="72" y1="134" x2="80" y2="134" stroke="#18333B" stroke-width="1.8"/>
<line x1="72" y1="114" x2="80" y2="114" stroke="#18333B" stroke-width="1.8"/>
<line x1="72" y1="94" x2="80" y2="94" stroke="#18333B" stroke-width="1.8"/>
<line x1="72" y1="74" x2="80" y2="74" stroke="#18333B" stroke-width="1.8"/>
<circle cx="115.75" cy="229" r="3.3" fill="#006E68" stroke="none" stroke-width="0"/>
<circle cx="155.5" cy="204" r="3.3" fill="#006E68" stroke="none" stroke-width="0"/>
<circle cx="195.25" cy="179" r="3.3" fill="#006E68" stroke="none" stroke-width="0"/>
<circle cx="195.25" cy="129" r="3.3" fill="#006E68" stroke="none" stroke-width="0"/>
<circle cx="155.5" cy="104" r="3.3" fill="#006E68" stroke="none" stroke-width="0"/>
<circle cx="115.75" cy="79" r="3.3" fill="#006E68" stroke="none" stroke-width="0"/>
<circle cx="76" cy="254" r="4.5" fill="white" stroke="#18333B" stroke-width="2"/>
<circle cx="76" cy="54" r="4.5" fill="white" stroke="#18333B" stroke-width="2"/>
<circle cx="235" cy="154.0" r="4.5" fill="white" stroke="#006E68" stroke-width="2"/>
<text x="121" y="250" font-size="15" font-weight="700" fill="#18333B" text-anchor="start" letter-spacing="0">Start</text>
<text x="88" y="49" font-size="15" font-weight="700" fill="#18333B" text-anchor="start" letter-spacing="0">Reunion</text>
<text x="245" y="159.0" font-size="15" font-weight="700" fill="#006E68" text-anchor="start" letter-spacing="0">Turn</text>
<rect x="333" y="34" width="319" height="231" fill="#F1F6F5" rx="5"/>
<text x="350" y="62" font-size="19" font-weight="700" fill="#18333B" text-anchor="start" letter-spacing="0">Clock readings</text>
<text x="350" y="92" font-size="14" font-weight="700" fill="#415A60" text-anchor="start" letter-spacing="0">Event</text>
<text x="522" y="92" font-size="14" font-weight="700" fill="#18333B" text-anchor="end" letter-spacing="0">Home</text>
<text x="634" y="92" font-size="14" font-weight="700" fill="#006E68" text-anchor="end" letter-spacing="0">Traveler</text>
<line x1="350" y1="101" x2="634" y2="101" stroke="#B7C9C6" stroke-width="1"/>
<text x="350" y="126" font-size="16" font-weight="400" fill="#18333B" text-anchor="start" letter-spacing="0">Start</text>
<text x="522" y="126" font-size="17" font-weight="400" fill="#18333B" text-anchor="end" letter-spacing="0">0</text>
<text x="634" y="126" font-size="17" font-weight="400" fill="#006E68" text-anchor="end" letter-spacing="0">0</text>
<text x="350" y="158" font-size="16" font-weight="400" fill="#18333B" text-anchor="start" letter-spacing="0">Turn</text>
<text x="522" y="158" font-size="17" font-weight="400" fill="#18333B" text-anchor="end" letter-spacing="0">5</text>
<text x="634" y="158" font-size="17" font-weight="400" fill="#006E68" text-anchor="end" letter-spacing="0">4</text>
<text x="350" y="190" font-size="16" font-weight="700" fill="#18333B" text-anchor="start" letter-spacing="0">Reunion</text>
<text x="522" y="190" font-size="17" font-weight="700" fill="#18333B" text-anchor="end" letter-spacing="0">10</text>
<text x="634" y="190" font-size="17" font-weight="700" fill="#006E68" text-anchor="end" letter-spacing="0">8</text>
<line x1="350" y1="202" x2="634" y2="202" stroke="#B7C9C6" stroke-width="1"/>
<text x="350" y="225" font-size="15" font-weight="400" fill="#415A60" text-anchor="start" letter-spacing="0">At 0.6c in either direction, the</text>
<text x="350" y="246" font-size="15" font-weight="400" fill="#415A60" text-anchor="start" letter-spacing="0">traveler accrues 0.8 tick per home tick.</text>
</g>
</svg>
