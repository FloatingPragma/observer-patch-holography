<svg xmlns="http://www.w3.org/2000/svg" width="6.3in" height="2.8827in" viewBox="0 0 660 302" role="img" aria-labelledby="title desc">
<title id="title">How the moving-packet clock was read</title><desc id="desc">A once-around tag marks a circulating wave. Three independent sets of repeated preparations compare station timing, the stationary beat, and the returned beat.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="660" height="302" fill="white"/>
<line x1="241" y1="12" x2="241" y2="279" stroke="#D1DCDB" stroke-width="1"/>
<text x="12" y="25" font-size="18" font-weight="700" fill="#18333B" text-anchor="start" letter-spacing="0">Periodic channel</text>
<circle cx="116" cy="137" r="61" fill="none" stroke="#006E68" stroke-width="2.5"/>
<circle cx="116.0" cy="76.0" r="6" fill="#18333B" stroke="white" stroke-width="1.3"/>
<circle cx="159.1335136523794" cy="93.86648634762061" r="4" fill="white" stroke="#006E68" stroke-width="2"/>
<circle cx="177.0" cy="137.0" r="4" fill="white" stroke="#006E68" stroke-width="2"/>
<circle cx="159.1335136523794" cy="180.1335136523794" r="4" fill="white" stroke="#006E68" stroke-width="2"/>
<circle cx="116.0" cy="198.0" r="4" fill="white" stroke="#A34F2B" stroke-width="2"/>
<circle cx="72.86648634762061" cy="180.1335136523794" r="4" fill="white" stroke="#006E68" stroke-width="2"/>
<circle cx="55.0" cy="137.0" r="4" fill="white" stroke="#006E68" stroke-width="2"/>
<circle cx="72.8664863476206" cy="93.86648634762061" r="4" fill="white" stroke="#006E68" stroke-width="2"/>
<text x="116" y="58" font-size="14" font-weight="700" fill="#18333B" text-anchor="middle" letter-spacing="0">Home</text>
<line x1="116" y1="62" x2="116" y2="69" stroke="#18333B" stroke-width="1"/>
<path d="M69.5 176.5 L64.2 170.5" stroke="#006E68" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M62 166 L64 176 L70.5 171 Z" stroke="none" stroke-width="0" fill="#006E68" stroke-linejoin="round" stroke-linecap="round"/>
<text x="116" y="135" font-size="15" font-weight="700" fill="#006E68" text-anchor="middle" letter-spacing="0">8 timed</text>
<text x="116" y="155" font-size="15" font-weight="700" fill="#006E68" text-anchor="middle" letter-spacing="0">encounters</text>
<line x1="116" y1="204" x2="116" y2="213" stroke="#A34F2B" stroke-width="1.2"/>
<text x="116" y="228" font-size="14" font-weight="700" fill="#A34F2B" text-anchor="middle" letter-spacing="0">Signed crossing tag</text>
<text x="116" y="252" font-size="14" font-weight="400" fill="#415A60" text-anchor="middle" letter-spacing="0">One excitation per preparation</text>
<text x="116" y="274" font-size="14" font-weight="400" fill="#415A60" text-anchor="middle" letter-spacing="0">Repeated terminal detections</text>
<text x="263" y="25" font-size="18" font-weight="700" fill="#18333B" text-anchor="start" letter-spacing="0">Independent preparations</text>
<rect x="263" y="43" width="3" height="53" fill="#006E68" rx="0"/>
<rect x="263" y="117" width="3" height="53" fill="#006E68" rx="0"/>
<rect x="263" y="205" width="3" height="53" fill="#A34F2B" rx="0"/>
<text x="276" y="60" font-size="16" font-weight="700" fill="#18333B" text-anchor="start" letter-spacing="0">Time the free wave and the packet</text>
<text x="276" y="82" font-size="15" font-weight="400" fill="#415A60" text-anchor="start" letter-spacing="0">Station arrivals give the speed ratio 0.80104.</text>
<line x1="263" y1="106" x2="646" y2="106" stroke="#D1DCDB" stroke-width="1"/>
<text x="276" y="134" font-size="16" font-weight="700" fill="#18333B" text-anchor="start" letter-spacing="0">Read the internal beat at rest</text>
<text x="276" y="156" font-size="15" font-weight="400" fill="#415A60" text-anchor="start" letter-spacing="0">Use that rate and the measured speed.</text>
<text x="276" y="177" font-size="15" font-weight="400" fill="#415A60" text-anchor="start" letter-spacing="0">Seal the predicted moving/rest ratio of 0.59861.</text>
<line x1="263" y1="193" x2="646" y2="193" stroke="#D1DCDB" stroke-width="1"/>
<text x="276" y="222" font-size="16" font-weight="700" fill="#18333B" text-anchor="start" letter-spacing="0">Read the tagged returns at home</text>
<text x="276" y="244" font-size="15" font-weight="400" fill="#415A60" text-anchor="start" letter-spacing="0">Four phase-sensitive counts yield the moving</text>
<text x="276" y="265" font-size="15" font-weight="400" fill="#415A60" text-anchor="start" letter-spacing="0">beat. The measured moving/rest ratio is 0.59817.</text>
</g>
</svg>
