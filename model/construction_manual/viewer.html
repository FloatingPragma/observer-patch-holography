<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-contrast-memory-spherical-v1: the executable construction, full sheet</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6f8fa; font: 14px Helvetica, Arial, sans-serif; color: #1f2328; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
         background: #ffffff; border-bottom: 1px solid #d0d7de; z-index: 2; }
  #bar b { margin-right: 12px; }
  button { font: inherit; padding: 5px 12px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; cursor: pointer; }
  button:hover { background: #eaeef2; }
  #stage { position: absolute; top: 45px; left: 0; right: 0; bottom: 0; overflow: hidden; cursor: grab; }
  #stage.drag { cursor: grabbing; }
  #sheet { position: absolute; top: 0; left: 0; transform-origin: 0 0; background: #ffffff; box-shadow: 0 1px 6px rgba(31,35,40,.15); user-select: none; }
  #hint { margin-left: auto; color: #59636e; }
</style>
</head>
<body>
<div id="bar">
  <b>The executable construction</b>
  <button id="fitw">Fit width</button>
  <button id="fitp">Fit page</button>
  <button id="full">100%</button>
  <button id="minus">−</button>
  <button id="plus">+</button>
  <button id="fs">Full screen</button>
  <span id="hint">wheel: zoom &nbsp; drag: move</span>
</div>
<div id="stage"><img id="sheet" src="executable_spec.svg" alt="The executable construction: hardware and software" draggable="false"></div>
<script>
  const stage = document.getElementById('stage'), img = document.getElementById('sheet');
  let s = 1, x = 0, y = 0, W = 2400, H = 4672;
  const apply = () => { img.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')'; };
  const fit = (page) => {
    const sw = stage.clientWidth / W, sh = stage.clientHeight / H;
    s = page ? Math.min(sw, sh) : sw; x = (stage.clientWidth - W * s) / 2; y = 0; apply();
  };
  const zoom = (f, cx, cy) => {
    const n = Math.min(8, Math.max(0.05, s * f));
    x = cx - (cx - x) * n / s; y = cy - (cy - y) * n / s; s = n; apply();
  };
  img.addEventListener('load', () => { W = img.naturalWidth || W; H = img.naturalHeight || H; img.width = W; img.height = H; fit(false); });
  stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  let d = null;
  stage.addEventListener('pointerdown', e => { d = [e.clientX - x, e.clientY - y]; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => { if (d) { x = e.clientX - d[0]; y = e.clientY - d[1]; apply(); } });
  stage.addEventListener('pointerup', () => { d = null; stage.classList.remove('drag'); });
  document.getElementById('fitw').onclick = () => fit(false);
  document.getElementById('fitp').onclick = () => fit(true);
  document.getElementById('full').onclick = () => { s = 1; x = Math.max(0, (stage.clientWidth - W) / 2); y = 0; apply(); };
  document.getElementById('plus').onclick = () => zoom(1.25, stage.clientWidth / 2, stage.clientHeight / 2);
  document.getElementById('minus').onclick = () => zoom(0.8, stage.clientWidth / 2, stage.clientHeight / 2);
  document.getElementById('fs').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); };
  window.addEventListener('resize', () => fit(false));
</script>
</body>
</html>
