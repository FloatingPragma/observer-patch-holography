<text xml:space="preserve" x="459.0" y="2614.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="middle" font-weight="normal">two loads on one seam</text>
<text xml:space="preserve" x="459.0" y="2638.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#cf222e" text-anchor="middle" font-weight="bold">10 κ</text>
<line x1="668.0" y1="2568.0" x2="682.0" y2="2568.0" stroke="#6e7781" stroke-width="2.40" stroke-linecap="round"/>
<circle cx="652.0" cy="2568.0" r="16.0" fill="#ffffff" stroke="#0969da" stroke-width="2.00"/>
<circle cx="652.0" cy="2568.0" r="7.0" fill="#1f2328" stroke="#1f2328" stroke-width="1.50"/>
