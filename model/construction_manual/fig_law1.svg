<text xml:space="preserve" x="62.0" y="2384.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="start" font-weight="bold">SOFTWARE 1</text>
<text xml:space="preserve" x="172.0" y="2384.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2328" text-anchor="start" font-weight="bold">Law 1: loads move, neighbours pay for disagreement</text>
<text xml:space="preserve" x="70.0" y="2444.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">H = ½ Σ_seams (1 − SWAP_e)  +  κ C</text>
<text xml:space="preserve" x="70.0" y="2476.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">C = Σ_seams (n_a − n_b)² + Σ_ports (6 − d_v) n_v²  =  6 Σ_ports n_v² − 2 Σ_seams n_a n_b</text>
<text xml:space="preserve" x="70.0" y="2510.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0969da" text-anchor="start" font-weight="bold">exchange: a load crosses its seam</text>
<text xml:space="preserve" x="370.0" y="2510.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#cf222e" text-anchor="start" font-weight="bold">agreement energy: a seam costs κ times the squared difference of its two loads</text>
<circle cx="110.0" cy="2568.0" r="24.0" fill="#ffffff" stroke="#0969da" stroke-width="2.40"/>
<circle cx="110.0" cy="2568.0" r="10.0" fill="#1f2328" stroke="#1f2328" stroke-width="1.50"/>
