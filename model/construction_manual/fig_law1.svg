<circle cx="698.0" cy="2568.0" r="16.0" fill="#ffffff" stroke="#0969da" stroke-width="2.00"/>
<line x1="760.0" y1="2568.0" x2="774.0" y2="2568.0" stroke="#6e7781" stroke-width="2.40" stroke-linecap="round"/>
<circle cx="744.0" cy="2568.0" r="16.0" fill="#ffffff" stroke="#0969da" stroke-width="2.00"/>
<circle cx="790.0" cy="2568.0" r="16.0" fill="#ffffff" stroke="#0969da" stroke-width="2.00"/>
<circle cx="790.0" cy="2568.0" r="7.0" fill="#1f2328" stroke="#1f2328" stroke-width="1.50"/>
<text xml:space="preserve" x="721.0" y="2614.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="middle" font-weight="normal">two loads apart</text>
<text xml:space="preserve" x="721.0" y="2638.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#cf222e" text-anchor="middle" font-weight="bold">12 κ</text>
<line x1="930.0" y1="2568.0" x2="944.0" y2="2568.0" stroke="#6e7781" stroke-width="2.40" stroke-linecap="round"/>
<circle cx="914.0" cy="2568.0" r="16.0" fill="#ffffff" stroke="#0969da" stroke-width="2.00"/>
