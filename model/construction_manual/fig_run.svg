efX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="as-59636e" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#59636e"/></marker></defs>
<rect x="32" y="4124" width="2336" height="516" fill="#ffffff"/>
<rect x="40.0" y="4132.0" width="2320.0" height="500.0" rx="14.0" fill="#ffffff" stroke="#d0d7de" stroke-width="1.50"/>
<path d="M54.0,4132.0 h2292.0 a14,14 0 0 1 14,14 v34 h-2320.0 v-34 a14,14 0 0 1 14,-14 z" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text xml:space="preserve" x="62.0" y="4164.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="start" font-weight="bold">SOFTWARE 4</text>
<text xml:space="preserve" x="172.0" y="4164.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2328" text-anchor="start" font-weight="bold">Observers, instruments, clocks: one run from preparation to record</text>
<rect x="68.0" y="4208.0" width="340.0" height="170.0" rx="12.0" fill="#ffffff" stroke="#59636e" stroke-width="2.00"/>
<text xml:space="preserve" x="84.0" y="4240.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#59636e" text-anchor="start" font-weight="bold">1  prepare</text>
<text xml:space="preserve" x="84.0" y="4270.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">measure every loop, keep the</text>
<text xml:space="preserve" x="84.0" y="4294.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">sign, correct it; fill the</text>
<text xml:space="preserve" x="84.0" y="4318.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">transits; ramp each star to</text>
<text xml:space="preserve" x="84.0" y="4342.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">the calm reference</text>
<line x1="414.0" y1="4293.0" x2="447.0" y2="4293.0" stroke="#1f2328" stroke-width="2.20" marker-end="url(#ah-1f2328)"/>
<rect x="452.8" y="4208.0" width="340.0" height="170.0" rx="12.0" fill="#ffffff" stroke="#9a6700" stroke-width="2.00"/>
<text xml:space="preserve" x="468.8" y="4240.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#9a6700" text-anchor="start" font-weight="bold">2  write</text>
<text xml:space="preserve" x="468.8" y="4270.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">a fuel at level 0 is coupled</text>
<text xml:space="preserve" x="468.8" y="4294.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">to a local target for a short</text>
<text xml:space="preserve" x="468.8" y="4318.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">pulse while the law keeps</text>
<text xml:space="preserve" x="468.8" y="4342.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">running</text>
<line x1="798.8" y1="4293.0" x2="831.8" y2="4293.0" stroke="#1f2328" stroke-width="2.20" marker-end="url(#ah-1f2328)"/>
<rect x="837.6" y="4208.0" width="340.0" height="170.0" rx="12.0" fill="#ffffff" stroke="#8250df" stroke-width="2.00"/>
<text xml:space="preserve" x="853.6" y="4240.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8250df" text-anchor="start" font-weight="bold">3  let it run</text>
<text xml:space="preserve" x="853.6" y="4270.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">the law acts alone; the</text>
<text xml:space="preserve" x="853.6" y="4294.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">observer counts cycles of its</text>
<text xml:space="preserve" x="853.6" y="4318.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">own circulation, three</text>
<text xml:space="preserve" x="853.6" y="4342.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">transits round its port</text>
<line x1="1183.6" y1="4293.0" x2="1216.6" y2="4293.0" stroke="#1f2328" stroke-width="2.20" marker-end="url(#ah-1f2328)"/>
<rect x="1222.4" y="4208.0" width="340.0" height="170.0" rx="12.0" fill="#ffffff" stroke="#9a6700" stroke-width="2.00"/>
<text xml:space="preserve" x="1238.4" y="4240.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#9a6700" text-anchor="start" font-weight="bold">4  read</text>
<text xml:space="preserve" x="1238.4" y="4270.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">a second pulse with one of</text>
<text xml:space="preserve" x="1238.4" y="4294.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">four phase settings; the fuel</text>
<text xml:space="preserve" x="1238.4" y="4318.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">is copied into two pointers</text>
<text xml:space="preserve" x="1238.4" y="4342.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">after the coupling is off</text>
<line x1="1568.4" y1="4293.0" x2="1601.4" y2="4293.0" stroke="#1f2328" stroke-width="2.20" marker-end="url(#ah-1f2328)"/>
<rect x="1607.2" y="4208.0" width="340.0" height="170.0" rx="12.0" fill="#ffffff" stroke="#1a7f37" stroke-width="2.00"/>
<text xml:space="preserve" x="1623.2" y="4240.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a7f37" text-anchor="start" font-weight="bold">5  agree</text>
<text xml:space="preserve" x="1623.2" y="4270.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">two observers on an overlap</text>
<text xml:space="preserve" x="1623.2" y="4294.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">compare complete reports;</text>
<text xml:space="preserve" x="1623.2" y="4318.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">identical reports are admitted,</text>
<text xml:space="preserve" x="1623.2" y="4342.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">every other outcome is kept</text>
<line x1="1953.2" y1="4293.0" x2="1986.2" y2="4293.0" stroke="#1f2328" stroke-width="2.20" marker-end="url(#ah-1f2328)"/>
<rect x="1992.0" y="4208.0" width="340.0" height="170.0" rx="12.0" fill="#ffffff" stroke="#0969da" stroke-width="2.00"/>
<text xml:space="preserve" x="2008.0" y="4240.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#0969da" text-anchor="start" font-weight="bold">6  record</text>
<text xml:space="preserve" x="2008.0" y="4270.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">three copies of the admitted</text>
<text xml:space="preserve" x="2008.0" y="4294.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">record; the order and count</text>
<text xml:space="preserve" x="2008.0" y="4318.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">of its own records are the</text>
<text xml:space="preserve" x="2008.0" y="4342.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">observer’s clock</text>
<text xml:space="preserve" x="70.0" y="4422.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">clock:   χ_b = ( |a,b,c⟩ + |c,b,f⟩ − |a,b,f⟩ ) / √3,   D χ_b = −m χ_b          reading:   p(fuel full) − p(fuel empty) = |amplitude of one added object|²</text>
<text xml:space="preserve" x="70.0" y="4450.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#59636e" text-anchor="start" font-weight="normal">four settings θ = 0, π/2, π, 3π/2 turn the differences into one complex number per count q; its spectrum over q shows the frequencies in units of the observer’s reference</text>
<text xml:space="preserve" x="70.0" y="4498.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Observers first.</text>
<text xml:space="preserve" x="220.0" y="4498.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2328" text-anchor="start" font-weight="normal">Ports, seams and cells are the hardware of a computation. They are no space. What is compared with nature is what the observers record and agree on.</text>
<text xml:space="preserve" x="220.0" y="4524.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2328" text-anchor="start" font-weight="normal">No observer reads the state of the program, its evolution parameter or a common clock; two observers compare clocks through the records on their overlap.</text>
<text xml:space="preserve" x="70.0" y="4610.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="start" font-weight="normal">Both laws are candidates under test. Law 1 is specified in model/contrast_memory_spherical_v1/SPEC.md; the package for law 2 is model/scalar_channel, with the cage in model/scalar_channel/cage.</text>
</svg>
