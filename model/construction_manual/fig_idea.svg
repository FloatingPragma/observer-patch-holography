<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 104 2336 346" width="2336" height="346" role="img" aria-label="idea">
<defs><marker id="ah-1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="as-1f2328" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2328"/></marker><marker id="ah-0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="as-0969da" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0969da"/></marker><marker id="ah-bc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="as-bc4c00" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#bc4c00"/></marker><marker id="ah-8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="as-8250df" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8250df"/></marker><marker id="ah-1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="as-1a7f37" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1a7f37"/></marker><marker id="ah-9a6700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="as-9a6700" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9a6700"/></marker><marker id="ah-59636e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="as-59636e" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#59636e"/></marker></defs>
<rect x="32" y="104" width="2336" height="346" fill="#ffffff"/>
<rect x="40.0" y="112.0" width="2320.0" height="330.0" rx="14.0" fill="#ffffff" stroke="#d0d7de" stroke-width="1.50"/>
<path d="M54.0,112.0 h2292.0 a14,14 0 0 1 14,14 v34 h-2320.0 v-34 a14,14 0 0 1 14,-14 z" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text xml:space="preserve" x="62.0" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="start" font-weight="bold">THE IDEA</text>
<text xml:space="preserve" x="152.8" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2328" text-anchor="start" font-weight="bold">A Universe that computes its own history</text>
<circle cx="272.0" cy="312.0" r="78.0" fill="none" stroke="#59636e" stroke-width="2.4" stroke-dasharray="2 9"/>
<circle cx="272.0" cy="234.0" r="11.0" fill="#0969da" stroke="#0969da" stroke-width="1.50"/>
<line x1="320.0" y1="250.5" x2="333.5" y2="264.0" stroke="#59636e" stroke-width="2.20" marker-end="url(#ah-59636e)"/>
<text xml:space="preserve" x="272.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0969da" text-anchor="middle" font-weight="bold">observers hold records</text>
<circle cx="350.0" cy="312.0" r="11.0" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.50"/>
<line x1="333.5" y1="360.0" x2="320.0" y2="373.5" stroke="#59636e" stroke-width="2.20" marker-end="url(#ah-59636e)"/>
<text xml:space="preserve" x="370.0" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a7f37" text-anchor="start" font-weight="bold">they recover</text>
<text xml:space="preserve" x="370.0" y="327.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a7f37" text-anchor="start" font-weight="bold">the rules</text>
<circle cx="272.0" cy="390.0" r="11.0" fill="#9a6700" stroke="#9a6700" stroke-width="1.50"/>
<line x1="224.0" y1="373.5" x2="210.5" y2="360.0" stroke="#59636e" stroke-width="2.20" marker-end="url(#ah-59636e)"/>
<text xml:space="preserve" x="272.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9a6700" text-anchor="middle" font-weight="bold">they build the machine</text>
<circle cx="194.0" cy="312.0" r="11.0" fill="#8250df" stroke="#8250df" stroke-width="1.50"/>
<line x1="210.5" y1="264.0" x2="224.0" y2="250.5" stroke="#59636e" stroke-width="2.20" marker-end="url(#ah-59636e)"/>
<text xml:space="preserve" x="174.0" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8250df" text-anchor="end" font-weight="bold">its run is</text>
<text xml:space="preserve" x="174.0" y="327.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8250df" text-anchor="end" font-weight="bold">this history</text>
<text xml:space="preserve" x="272.0" y="317.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="middle" font-weight="normal">no outside</text>
<text xml:space="preserve" x="540.0" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" text-anchor="start" font-weight="bold">A brain that thinks itself into existence</text>
<text xml:space="preserve" x="540.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">The Universe is a network of very simple observers. Each holds</text>
<text xml:space="preserve" x="540.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">a few records and compares them with its neighbours. What</text>
<text xml:space="preserve" x="540.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">survives every comparison is a public fact. The observers inside</text>
<text xml:space="preserve" x="540.0" y="306.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">work out the rules and build the machine whose run is this same</text>
<text xml:space="preserve" x="540.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">history, its builders included. Nothing stands outside the loop.</text>
<text xml:space="preserve" x="540.0" y="374.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#59636e" text-anchor="start" font-weight="normal">closure:  R(D(U)) ≅ U</text>
<text xml:space="preserve" x="1160.0" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" text-anchor="start" font-weight="bold">Why this problem can be solved</text>
<text xml:space="preserve" x="1160.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">A consistent history is a fixed point: every record agrees with every</text>
<text xml:space="preserve" x="1160.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">record it overlaps. A search through all histories grows exponentially.</text>
<text xml:space="preserve" x="1160.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">The observers do not search. Each repairs what it shares with one</text>
<text xml:space="preserve" x="1160.0" y="306.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">neighbour, and every accepted repair lowers the total disagreement by</text>
<text xml:space="preserve" x="1160.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">a fixed step. The work is bounded by the disagreement at the start:</text>
<text xml:space="preserve" x="1160.0" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">polynomial in the number of ports.</text>
<text xml:space="preserve" x="1160.0" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#59636e" text-anchor="start" font-weight="normal">Proved for the native repair of the theory, with loads bounded by the alphabet.</text>
<text xml:space="preserve" x="1160.0" y="407.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#59636e" text-anchor="start" font-weight="normal">For the two candidate laws tested here it is the target, and work in progress.</text>
<text xml:space="preserve" x="1840.0" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" text-anchor="start" font-weight="bold">How large it is</text>
<text xml:space="preserve" x="1840.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">The carriers of the tests: 20, 80 and 320 cells.</text>
<text xml:space="preserve" x="1840.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">The screen of the Universe we inhabit: about</text>
<text xml:space="preserve" x="1840.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">8 × 10¹²² cells in the count of the theory.</text>
<text xml:space="preserve" x="1840.0" y="306.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">One kind of cell, one wiring, one law on every seam,</text>
<text xml:space="preserve" x="1840.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">repeated that many times.</text>
</svg>
