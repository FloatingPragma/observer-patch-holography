<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1898" viewBox="0 0 680 1898" role="img" aria-labelledby="title desc">
<title id="title">Observable priority of local repairs and exact boundary information</title>
<desc id="desc">Controlled seam readings recover the incident precedence relation. A differing comparison yields a common preparation with opposite results. Agreement with the native class supplies a certified cell reconstruction with exactly three classical boundary bits.</desc>
