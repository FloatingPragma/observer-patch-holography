<text xml:space="preserve" x="1270.0" y="2794.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="start" font-weight="normal">Two shelves and a hop between them:</text>
<text xml:space="preserve" x="1270.0" y="2815.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="start" font-weight="normal">a first-order law whose square is</text>
<text xml:space="preserve" x="1270.0" y="2836.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="start" font-weight="normal">the wave relation ω² = m² + λ.</text>
