<text xml:space="preserve" x="2070.0" y="2815.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8250df" text-anchor="start" font-weight="bold">ideal sea: 120 filled modes</text>
<text xml:space="preserve" x="2070.0" y="2836.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8250df" text-anchor="start" font-weight="normal">finite ramps approximate it</text>
<text xml:space="preserve" x="2070.0" y="2636.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">one object more:</text>
<text xml:space="preserve" x="2070.0" y="2657.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">energy ≥ m above the ideal sea</text>
<text xml:space="preserve" x="1250.0" y="2932.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">The 150 modes of one cell</text>
<rect x="1250.0" y="2948.0" width="276.0" height="40.0" rx="6.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.60"/>
<text xml:space="preserve" x="1262.0" y="2974.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">23  port-band modes</text>
<rect x="1530.0" y="2948.0" width="266.0" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#59636e" stroke-width="1.60"/>
<text xml:space="preserve" x="1542.0" y="2974.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">36  seam-detail modes</text>
<rect x="1800.0" y="2948.0" width="526.0" height="40.0" rx="6.0" fill="#fbefff" stroke="#8250df" stroke-width="1.60"/>
<text xml:space="preserve" x="1812.0" y="2974.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">91  modes at −m, including local references</text>
<text xml:space="preserve" x="1250.0" y="3024.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Many objects with exclusion</text>
<text xml:space="preserve" x="1250.0" y="3054.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">H₀ = Σ_seams n_e − Σ_wedges n_w + (1/√2) Σ_wedges [ (c†_ab − c†_bc) c_w + h.c. ]</text>
<text xml:space="preserve" x="1250.0" y="3094.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">On ordinary registers (one cell)</text>
<text xml:space="preserve" x="1250.0" y="3124.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">H = H₀ + 1024 Σ_ports (1 − P_b) + 512 Σ_loops (P_S − C_l) + 1024 Σ_unused (1 − |0⟩⟨0|)</text>
<text xml:space="preserve" x="1250.0" y="3152.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">432 encoded bits; routed loop preparation adds twelve neutral scratch bits.</text>
<text xml:space="preserve" x="1250.0" y="3176.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">259 independent loop constraints select the sector of even total parity for 174 modes.</text>
<text xml:space="preserve" x="1250.0" y="3200.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">The displayed penalties are supplied code-protection terms; the accepted code is neutral.</text>
<text xml:space="preserve" x="1250.0" y="3238.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">One-cell scalar scope</text>
<text xml:space="preserve" x="1250.0" y="3266.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">The displayed levels are the spectrum of the declared free generator at m = 1.</text>
<text xml:space="preserve" x="1250.0" y="3290.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">Finite source-on pulses and approximate preparation determine the actual pointer laws.</text>
<text xml:space="preserve" x="1250.0" y="3314.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">Neutral scalar-code states do not establish a faithful charged response or an observed particle.</text>
<text xml:space="preserve" x="1250.0" y="3338.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">Round-sphere modifications change B and require their own source and instrument checks.</text>
<text xml:space="preserve" x="1250.0" y="3408.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="start" font-weight="normal">Supplied: m = 1, pulses, ramps and apparatus. Scalar ancestor: A-native-scalar-overlap-v3; separate from the contrast law.</text>
</svg>
