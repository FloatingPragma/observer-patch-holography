<text xml:space="preserve" x="1242.0" y="2384.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="start" font-weight="bold">SOFTWARE 2</text>
<text xml:space="preserve" x="1352.0" y="2384.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2328" text-anchor="start" font-weight="bold">Law 2: an object hops between a seam and a wedge</text>
<text xml:space="preserve" x="1250.0" y="2444.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">D = [[mI, B], [Bᵀ, −mI]]     D² = m²I + diag(BBᵀ, BᵀB)</text>
<text xml:space="preserve" x="1250.0" y="2476.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">B: seam (a,b) to wedge (a,b,c) with +1/√2, seam (b,c) to the same wedge with −1/√2</text>
<text xml:space="preserve" x="1250.0" y="2502.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">K = BBᵀ = half the seam-graph Laplacian.   Paired frequencies: ω² = m² + λ, λ &gt; 0 in K</text>
<line x1="1270.0" y1="2594.0" x2="1500.0" y2="2594.0" stroke="#1f2328" stroke-width="3.00" stroke-linecap="round"/>
<text xml:space="preserve" x="1512.0" y="2600.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">+m   the object on a seam</text>
<line x1="1270.0" y1="2744.0" x2="1500.0" y2="2744.0" stroke="#8250df" stroke-width="3.00" stroke-linecap="round"/>
<text xml:space="preserve" x="1512.0" y="2750.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8250df" text-anchor="start" font-weight="normal">−m   the object in transit</text>
<line x1="1385.0" y1="2606.0" x2="1385.0" y2="2732.0" stroke="#8250df" stroke-width="2.20" marker-end="url(#ah-8250df)" marker-start="url(#as-8250df)"/>
