<text xml:space="preserve" x="62.0" y="3504.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="start" font-weight="bold">SOFTWARE 3</text>
<text xml:space="preserve" x="172.0" y="3504.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2328" text-anchor="start" font-weight="bold">Finite scalar services: preparation, pulses and retained pointer records</text>
<rect x="68.0" y="3548.0" width="340.0" height="170.0" rx="12.0" fill="#ffffff" stroke="#59636e" stroke-width="2.00"/>
<text xml:space="preserve" x="84.0" y="3580.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#59636e" text-anchor="start" font-weight="bold">1  prepare</text>
<text xml:space="preserve" x="84.0" y="3610.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">route loop reads; retain signs</text>
<text xml:space="preserve" x="84.0" y="3634.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">and apply feedback; fill the</text>
<text xml:space="preserve" x="84.0" y="3658.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">transits; finite star ramps</text>
<text xml:space="preserve" x="84.0" y="3682.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">approximate the ideal sea</text>
<line x1="414.0" y1="3633.0" x2="447.0" y2="3633.0" stroke="#1f2328" stroke-width="2.20" marker-end="url(#ah-1f2328)"/>
<rect x="452.8" y="3548.0" width="340.0" height="170.0" rx="12.0" fill="#ffffff" stroke="#9a6700" stroke-width="2.00"/>
<text xml:space="preserve" x="468.8" y="3580.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#9a6700" text-anchor="start" font-weight="bold">2  write</text>
<text xml:space="preserve" x="468.8" y="3610.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">a fuel at level 0 is coupled</text>
<text xml:space="preserve" x="468.8" y="3634.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">to a local target for a short</text>
<text xml:space="preserve" x="468.8" y="3658.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">pulse while the law keeps</text>
<text xml:space="preserve" x="468.8" y="3682.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">running</text>
<line x1="798.8" y1="3633.0" x2="831.8" y2="3633.0" stroke="#1f2328" stroke-width="2.20" marker-end="url(#ah-1f2328)"/>
<rect x="837.6" y="3548.0" width="340.0" height="170.0" rx="12.0" fill="#ffffff" stroke="#8250df" stroke-width="2.00"/>
<text xml:space="preserve" x="853.6" y="3580.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8250df" text-anchor="start" font-weight="bold">3  let it run</text>
<text xml:space="preserve" x="853.6" y="3610.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">the law acts alone for the</text>
<text xml:space="preserve" x="853.6" y="3634.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">declared action q/8; local</text>
<text xml:space="preserve" x="853.6" y="3658.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">circulations supply reference</text>
<text xml:space="preserve" x="853.6" y="3682.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">modes, not an autonomous timer</text>
<line x1="1183.6" y1="3633.0" x2="1216.6" y2="3633.0" stroke="#1f2328" stroke-width="2.20" marker-end="url(#ah-1f2328)"/>
<rect x="1222.4" y="3548.0" width="340.0" height="170.0" rx="12.0" fill="#ffffff" stroke="#9a6700" stroke-width="2.00"/>
<text xml:space="preserve" x="1238.4" y="3580.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#9a6700" text-anchor="start" font-weight="bold">4  read</text>
<text xml:space="preserve" x="1238.4" y="3610.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">a second pulse with one of</text>
<text xml:space="preserve" x="1238.4" y="3634.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">four phase settings; the fuel</text>
<text xml:space="preserve" x="1238.4" y="3658.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">is copied into two pointers</text>
<text xml:space="preserve" x="1238.4" y="3682.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">after the coupling is off</text>
<line x1="1568.4" y1="3633.0" x2="1601.4" y2="3633.0" stroke="#1f2328" stroke-width="2.20" marker-end="url(#ah-1f2328)"/>
<rect x="1607.2" y="3548.0" width="340.0" height="170.0" rx="12.0" fill="#ffffff" stroke="#1a7f37" stroke-width="2.00"/>
<text xml:space="preserve" x="1623.2" y="3580.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a7f37" text-anchor="start" font-weight="bold">5  compare</text>
<text xml:space="preserve" x="1623.2" y="3610.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">retain the complete two-pointer</text>
<text xml:space="preserve" x="1623.2" y="3634.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">law: 00, 10, 01 and 11;</text>
<text xml:space="preserve" x="1623.2" y="3658.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">the copied values agree when</text>
<text xml:space="preserve" x="1623.2" y="3682.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">both writes act as declared</text>
<line x1="1953.2" y1="3633.0" x2="1986.2" y2="3633.0" stroke="#1f2328" stroke-width="2.20" marker-end="url(#ah-1f2328)"/>
<rect x="1992.0" y="3548.0" width="340.0" height="170.0" rx="12.0" fill="#ffffff" stroke="#0969da" stroke-width="2.00"/>
<text xml:space="preserve" x="2008.0" y="3580.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#0969da" text-anchor="start" font-weight="bold">6  record</text>
<text xml:space="preserve" x="2008.0" y="3610.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">retain both fuel inputs, four</text>
<text xml:space="preserve" x="2008.0" y="3634.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">phases and every query;</text>
<text xml:space="preserve" x="2008.0" y="3658.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">record pulse work and the</text>
<text xml:space="preserve" x="2008.0" y="3682.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">supplied service schedule</text>
<text xml:space="preserve" x="70.0" y="3762.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">reference: χ_b = (|a,b,c⟩ + |c,b,f⟩ − |a,b,f⟩)/√3, Dχ_b = −mχ_b.   h = D ⊕ 0_app; finite pulse U_p = exp[−iπ(h + V)/(4g)]</text>
<text xml:space="preserve" x="70.0" y="3790.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#59636e" text-anchor="start" font-weight="normal">p_b = P(fuel out=1 | fuel in=reference in=b), same source. Then p₁ − p₀ = |U_ff|² for the complete finite-pulse map U, with decoupled reference.</text>
<text xml:space="preserve" x="70.0" y="3838.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Service scope.</text>
<text xml:space="preserve" x="220.0" y="3838.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2328" text-anchor="start" font-weight="normal">The diagram describes finite simulation-generated records. Preparation, scheduling, pulse strength and phase are supplied construction choices.</text>
<text xml:space="preserve" x="220.0" y="3864.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2328" text-anchor="start" font-weight="normal">The source-energy ledger includes pulse driving work. It supplies neither controller energy accounting nor an autonomous clock or repeated reset budget.</text>
<text xml:space="preserve" x="70.0" y="3950.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="start" font-weight="normal">Figures describe declared domains. Active contrast specification: model/polynomial_sv/SPEC.md. Scalar source map: model/np_scalar/PROOF.md.</text>
</svg>
