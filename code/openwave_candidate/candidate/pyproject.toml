[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oph-openwave-candidate"
version = "0.1.0"
description = "Portable finite OPH computations for an OpenWave candidate assessment"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3,<3", "sympy>=1.14,<2", "mpmath>=1.3,<2", "scipy>=1.15,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
integration = ["scipy>=1.14,<2"]

[project.scripts]
oph-openwave = "oph_openwave.runner:main"

[tool.setuptools.packages.find]
include = ["oph_openwave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
