      "informal": "Everything that observer agreement leaves unconstrained is maximally random.",
      "formal_concise": "At finite regulator r, a state is a compatible family of local normalized states on the accessible algebra net. Let K_r be the nonempty convex set of such families satisfying the finite observer-visible constraints supplied by A1 and A2, generated by an A1 observable and constraint grammar through which every A2-visible constraint provably factors. A3 supplies an exact reference and aggregation rule: a compatible local reference family tau_r, a finite A1-generated observer cover G_r whose restriction map is injective on K_r, and strictly positive exact weights w_{r,P} from quotient-visible A1 data, natural under admissible presentation equivalence. Equivalently at smooth points, no nonzero feasible tangent is invisible to the entire cover. The realized state is the information projection rho_r = argmin over K_r of the weighted sum of finite-algebra Umegaki relative entropies D(rho_P || tau_P) over the cover. When every local reference density is identity-proportional in its declared trace, this equals weighted local entropy maximization.",
