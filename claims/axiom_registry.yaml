      "id": "A2",
      "key": "observer_meaning_agreement",
      "title": "Observer agreement",
      "informal": "Observers operating on the screen agree on the meaning of the data they jointly interpret. Every proper recharting of a complete carrier can be performed by their own reversible overlap response rather than by an external relabeling.",
      "formal_concise": "For each regulator r, the interpretation map J_r from observer-accessible data to operational meanings is natural with respect to every visible overlap restriction, recharting, seam translation, higher-overlap map, federation map, and refinement map. Accepted reversible overlap transports form a groupoid O_r. For each complete carrier chart o, the map from closed overlap paths Hol_r(o) onto the orientation-preserving incidence automorphisms Aut+(K) is surjective. For every proper carrier automorphism a, A2 supplies one closed path gamma_a and one projective implementer [U_a] in PU(H), natural on port response by Ad_[U_a] D(v) = D(a.v). The implementer is endogenous: [U_a] = [g_a c_a] for g_a in the identity component generated by exp(tD(v)) and c_a in the unitary centralizer of D(V). Path composition is projective and natural under refinement.",
