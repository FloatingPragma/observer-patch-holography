      "key": "observer_screen_architecture",
      "title": "Oriented twelve-port observer screen",
      "informal": "There exists an observer patch net on an oriented spherical screen. At every finite resolution, each local carrier has twelve primitive boundary ports. The ports form the vertices of an oriented triangular boundary with 30 edges and 20 faces, combinatorially the boundary of an icosahedron: five edges meet each port, the neighbors of each port form a five-cycle, and every edge belongs to two oppositely oriented faces. Carriers join through typed seams and coherent triple overlaps, refine to an oriented spherical support, and expose local state, readback, records, repair moves, and checkpoints.",
      "formal_concise": "For every regulator r in a directed system (R, <=) there is a typed observer-screen object N_r = (P_r, A_r, R_r, I_r, U_r, C_r, N_r, S_r, b_r): a finite patch/overlap category with an isotone local algebra net; central record algebras; interface, update, and checkpoint types; a federation C_r of finite local carriers, each carrying twelve primitive pairwise-orthogonal central port projections summing to one and a boundary packet K = (P, E, F, o) with |P| = 12, |E| = 30, |F| = 20, degree-five ports with five-cycle links, and coherently oriented two-face edges, combinatorially isomorphic to the icosahedral boundary complex with no preferred labels; seam algebras with unital restriction maps and coherent triple-overlap cocycles forming the nerve N_r; a declared finite edge-midpoint refinement support S_r with an orientation-preserving realization into the two-sphere, mesh tending to zero, and a source-bound degree-one simplicial bridge b_r from the nerve; and refinement maps commuting with routing, quotienting, incidence, records, checkpoints, and support projection.",
      "reference_anchor": "docs/AXIOM_REFERENCE.md#a1-oriented-twelve-port-observer-screen",
      "constrains": "The local carrier boundary combinatorics, the typed carrier-federation-support architecture, the interface and repair type surface, and the refinement tower with its controlled spherical support realization.",
