      "realization_boundary": "The carrier, federation, and refinement receipts instantiate the architectural portion of A1. The algebraic current fixture is an existence and regression witness. It does not instantiate the strengthened source clause until an executable producer reconstructs D, its commutator, and response completeness from ordered source histories without selecting a named current model.",
