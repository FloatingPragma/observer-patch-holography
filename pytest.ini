[pytest]
python_files = test_*.py
# A bare `python -m pytest` collects code/ only. The regression tests under
# tools/ run through `python tools/run_mandatory_suite.py`, which is the
# acceptance bar (REPRODUCE.md); a bare pytest pass does not meet that bar.
# The executable model gate is `python -m model` and
# `python -m pytest -q -W error model/contrast_memory_spherical_v1` (ci.yml).
# Source-specific component suites retain their separate replay gates.
testpaths = code
