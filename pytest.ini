[pytest]
python_files = test_*.py
# A bare `python -m pytest` collects code/ only. The regression tests under
# tools/ run through `python tools/run_mandatory_suite.py`, which is the
# acceptance bar (REPRODUCE.md); a bare pytest pass does not meet that bar.
# Runnable observer work has its own explicit gate: `python -m model.verify`
# and `python -m pytest -q -W error model` (observer-model.yml).
testpaths = code
# These are immutable input bytes, not modules in the current Python package.
# The dated custody suite runs unchanged in its authenticated 0194 checkout via
# tools/check_retained_completion_custody.py. The field checkpoint uses its authenticated c7 view; source-record custody
# tests remain in the ordinary collection.
addopts =
    --ignore=model/completion/historical
    --ignore=model/completion/test_custody_renewal.py
    --ignore=model/completion/test_field_custody.py
    --ignore=model/completion/test_field_navigation.py
